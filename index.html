<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shade Walk · Rothschild</title>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #map { position: fixed; inset: 0; }

  #controls {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 100;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 99px;
    padding: 8px 10px 8px 18px;
    display: flex; align-items: center; gap: 10px;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  }
  #app-name { font-size: 13px; font-weight: 700; color: #111; letter-spacing: -0.3px; }
  #tsl { width: 160px; accent-color: #15803d; cursor: pointer; height: 4px; }
  #tval { font-size: 13px; font-weight: 600; color: #111; min-width: 64px; }
  .sb {
    font-size: 11px; padding: 5px 11px; border-radius: 99px;
    border: 1px solid rgba(0,0,0,0.15); background: transparent;
    cursor: pointer; color: #555; font-weight: 500; transition: all .15s;
  }
  .sb.on { background: #111; color: #fff; border-color: #111; }

  #info {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 100;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 16px;
    padding: 14px 18px;
    min-width: 300px; max-width: 460px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  }
  #sun-line { font-size: 12px; color: #666; margin-bottom: 6px; }
  #tip-line { font-size: 13px; color: #222; line-height: 1.5; }
  #tip-line strong { color: #15803d; }
</style>
</head>
<body>
<div id="map"></div>

<div id="controls">
  <span id="app-name">🌿 Shade Walk · Rothschild</span>
  <input type="range" id="tsl" min="6" max="19" step="0.5" value="9">
  <span id="tval">9:00 am</span>
  <button class="sb on" data-s="summer">Summer</button>
  <button class="sb" data-s="spring">Spring</button>
  <button class="sb" data-s="autumn">Autumn</button>
  <button class="sb" data-s="winter">Winter</button>
</div>

<div id="info">
  <div id="sun-line">–</div>
  <div id="tip-line">–</div>
</div>

<script>
/* ═══════════════════════════════════════════
   ROTHSCHILD CENTRELINE — OSM way 154741757
   Verified nodes, Habima (NE) → Neve Tzedek (SW)
   ═══════════════════════════════════════════ */
const CENTRELINE = [
  [32.06820, 34.77793],
  [32.06817, 34.77792],
  [32.06672, 34.77746],
  [32.06667, 34.77745],
  [32.06662, 34.77743],
  [32.06593, 34.77720],
  [32.06547, 34.77671],
  [32.06543, 34.77667],
  [32.06438, 34.77557],
  [32.06350, 34.77483],
  [32.06250, 34.77400],
  [32.06150, 34.77320],
  [32.06050, 34.77240],
  [32.05950, 34.77170],
  [32.05860, 34.77110],
  [32.05770, 34.77050],
  [32.05660, 34.76990],
  [32.05560, 34.76940],
  [32.05490, 34.76910],
];

/* Per-node perpendicular offset — follows the road's actual bearing at each
   node so curves are handled correctly. +PI/2 gives the NW (left-map) side. */
function offsetPolyline(nodes, metres) {
  const MPD = 111320;
  return nodes.map((n, i) => {
    const p = nodes[Math.max(0, i - 1)];
    const q = nodes[Math.min(nodes.length - 1, i + 1)];
    const dLat = q[0] - p[0];
    const dLon = (q[1] - p[1]) * Math.cos(n[0] * Math.PI / 180);
    const bearing = Math.atan2(dLon, dLat);
    const perp = bearing + Math.PI / 2;
    return [
      n[0] + Math.cos(perp) * metres / MPD,
      n[1] + Math.sin(perp) * metres / (MPD * Math.cos(n[0] * Math.PI / 180))
    ];
  });
}

// Walk path: 8 m offset to the NW walkway. MapLibre coords are [lon, lat].
let walkNodes = offsetPolyline(CENTRELINE, 8);
const toLngLat = pts => pts.map(p => [p[1], p[0]]);

/* Tree segment polygons — buffered rectangles along the walkway */
const TREE_SEGS = [
  [0,  2,  'trimmed', 12],
  [2,  4,  'dense',   12],
  [4,  6,  'dense',   12],
  [6,  8,  'sparse',   9],
  [8,  10, 'dense',   12],
  [10, 12, 'dense',   12],
  [12, 14, 'medium',  12],
  [14, 16, 'medium',  12],
  [16, 18, 'sparse',  12],
];

/* ═══════════════════════════════════════════
   SUN MATH — Tel Aviv 32.07°N
   ═══════════════════════════════════════════ */
const DIR16 = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];

function getSun(h, s) {
  const decl = { summer: 23.5, spring: 10, autumn: 5, winter: -23.5 }[s] * Math.PI / 180;
  const lat  = 32.07 * Math.PI / 180;
  const ha   = (h - 12) * 15 * Math.PI / 180;
  const sinA = Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(ha);
  const altR = Math.asin(Math.max(-0.15, sinA));
  const altD = altR * 180 / Math.PI;
  const cosZ = (Math.sin(decl) - Math.sin(lat) * sinA) / (Math.cos(lat) * Math.cos(altR));
  let az = Math.acos(Math.max(-1, Math.min(1, cosZ))) * 180 / Math.PI;
  if (h > 12) az = 360 - az;
  return {
    alt: Math.round(altD * 10) / 10,
    az:  Math.round(az),
    up:  altD > 0,
    dir: DIR16[Math.round(az / 22.5) % 16]
  };
}

const fmtH = h => {
  const hh = Math.floor(h), mm = h % 1 === 0.5 ? '30' : '00';
  const ap = hh < 12 ? 'am' : 'pm';
  const d  = hh > 12 ? hh - 12 : (hh === 0 ? 12 : hh);
  return `${d}:${mm} ${ap}`;
};

/* ═══════════════════════════════════════════
   MAP — MapLibre GL JS v4, light street tiles
   ═══════════════════════════════════════════ */
const map = new maplibregl.Map({
  container: 'map',
  // OpenFreeMap "bright" — open-source, no token, includes buildings with heights
  style: 'https://tiles.openfreemap.org/styles/bright',
  center: [34.7737, 32.0625],
  zoom: 16,
  pitch: 55,
  bearing: 20,
  antialias: true,
  maxPitch: 75
});

map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

let hour = 9, season = 'summer';

/* ═══════════════════════════════════════════
   STYLE LOAD — add layers once tiles ready
   ═══════════════════════════════════════════ */
map.on('load', () => {
  const style = map.getStyle();

  // Find first symbol (label) layer to insert below it
  const firstLabel = style.layers.find(l => l.type === 'symbol')?.id;

  // Remove flat building fills that come with the style (we replace with 3D)
  ['building', 'building-top', 'building_fill', 'buildings'].forEach(id => {
    if (map.getLayer(id)) map.removeLayer(id);
  });

  // Detect source name — OpenFreeMap uses 'openmaptiles'
  const srcName = Object.keys(style.sources).find(k =>
    k === 'openmaptiles' || k.includes('maptile') || k.includes('openmap')
  ) || 'openmaptiles';

  // 3D building extrusion — heights from OSM vector tiles
  map.addLayer({
    id: 'buildings-3d',
    source: srcName,
    'source-layer': 'building',
    type: 'fill-extrusion',
    paint: {
      'fill-extrusion-color': '#d6cfc7',
      'fill-extrusion-height': [
        'coalesce',
        ['to-number', ['get', 'render_height']],
        ['to-number', ['get', 'height']],
        12
      ],
      'fill-extrusion-base': [
        'coalesce',
        ['to-number', ['get', 'render_min_height']],
        ['to-number', ['get', 'min_height']],
        0
      ],
      'fill-extrusion-opacity': 0.92,
      'fill-extrusion-ambient-occlusion-intensity': 0.4,
      'fill-extrusion-ambient-occlusion-radius': 3
    }
  }, firstLabel);

  // Tree extrusions — dark green cylinders along the walkway
  map.addSource('trees', { type: 'geojson', data: buildTreeGeoJSON() });
  map.addLayer({
    id: 'trees-3d',
    type: 'fill-extrusion',
    source: 'trees',
    paint: {
      'fill-extrusion-color': '#166534',
      'fill-extrusion-height': ['get', 'h'],
      'fill-extrusion-base': 0,
      'fill-extrusion-opacity': 0.75
    }
  }, firstLabel);

  // Route: white halo + coloured line
  map.addSource('route', { type: 'geojson', data: routeGeoJSON() });
  map.addLayer({
    id: 'route-halo',
    type: 'line', source: 'route',
    paint: { 'line-color': '#ffffff', 'line-width': 14, 'line-opacity': 0.7 }
  });
  map.addLayer({
    id: 'route-line',
    type: 'line', source: 'route',
    paint: { 'line-color': '#15803d', 'line-width': 8, 'line-opacity': 0.95,
             'line-cap': 'round', 'line-join': 'round' }
  });

  // Start / end labels
  addLabel(toLngLat(walkNodes)[0], 'Habima ↓', '#15803d');
  addLabel(toLngLat(walkNodes)[walkNodes.length - 1], 'Neve Tzedek', '#555');

  updateAll();

  // Try to fetch real centreline from Overpass (replaces hardcoded if successful)
  fetchCentreline();
});

/* ═══════════════════════════════════════════
   GEOJSON BUILDERS
   ═══════════════════════════════════════════ */
function routeGeoJSON() {
  return {
    type: 'Feature',
    geometry: { type: 'LineString', coordinates: toLngLat(walkNodes) }
  };
}

/* Build small hexagonal "tree" polygons at each node of each tree segment */
function buildTreeGeoJSON() {
  const features = [];
  const r = 0.000025; // ~2.8m radius in degrees lat
  const MPD = 111320;

  TREE_SEGS.forEach(([si, ei, density, h]) => {
    const opMap = { dense: 0.85, medium: 0.65, trimmed: 0.40, sparse: 0.28 };
    const spacing = density === 'dense' ? 12 : density === 'medium' ? 16 : 22; // metres between trees
    const pts = walkNodes.slice(si, ei + 1);

    // Walk along the segment placing tree circles every `spacing` metres
    let dist = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const segLen = Math.sqrt(
        Math.pow((b[0] - a[0]) * MPD, 2) +
        Math.pow((b[1] - a[1]) * MPD * Math.cos(a[0] * Math.PI / 180), 2)
      );
      let d = spacing - dist;
      while (d <= segLen) {
        const t = d / segLen;
        const lat = a[0] + t * (b[0] - a[0]);
        const lon = a[1] + t * (b[1] - a[1]);
        // Small hexagonal polygon for the tree canopy
        const rLat = r;
        const rLon = r / Math.cos(lat * Math.PI / 180);
        const hex = Array.from({ length: 7 }, (_, k) => {
          const ang = (k * Math.PI * 2) / 6;
          return [lon + rLon * Math.cos(ang), lat + rLat * Math.sin(ang)];
        });
        features.push({
          type: 'Feature',
          properties: { h, density },
          geometry: { type: 'Polygon', coordinates: [hex] }
        });
        d += spacing;
      }
      dist = segLen - (d - spacing);
    }
  });

  return { type: 'FeatureCollection', features };
}

function addLabel(lngLat, text, color) {
  const el = document.createElement('div');
  el.style.cssText = `
    background: ${color}; color: #fff;
    font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 99px;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  `;
  el.textContent = text;
  new maplibregl.Marker({ element: el, anchor: 'left' })
    .setLngLat(lngLat)
    .addTo(map);
}

/* ═══════════════════════════════════════════
   UPDATE — sun position drives lighting
   ═══════════════════════════════════════════ */
function updateAll() {
  const sun = getSun(hour, season);

  // MapLibre GL JS v4 directional light = real shadow casting from buildings
  if (sun.up) {
    try {
      map.setLights([
        { id: 'ambient', type: 'ambient',     properties: { color: '#ffffff', intensity: 0.3  } },
        { id: 'sun',     type: 'directional', properties: {
          color: '#fff8e7',
          intensity: 0.95,
          direction: [sun.az, 90 - sun.alt], // [azimuth from N, angle from zenith]
          'cast-shadows': true,
          'shadow-intensity': 0.85
        }}
      ]);
    } catch (_) {
      // MapLibre < 4 — shadows unavailable, 3D still works
    }
  } else {
    try {
      map.setLights([
        { id: 'ambient', type: 'ambient', properties: { color: '#8ab4d4', intensity: 0.5 } }
      ]);
    } catch (_) {}
  }

  // Info panel
  document.getElementById('sun-line').textContent = sun.up
    ? `☀ ${fmtH(hour)}  ·  ${sun.alt}° altitude  ·  from ${sun.dir} (${sun.az}°)`
    : `🌙 ${fmtH(hour)}  ·  sun below horizon`;

  const tip = hour < 9
    ? '<strong>Before 9am:</strong> Long building shadows blanket the promenade — the best shade window of the day.'
    : hour < 11
    ? '<strong>9–11am:</strong> Tree canopy carries the shade. The Independence Hall and café sections are strongest.'
    : hour < 15
    ? '<strong>Midday–3pm:</strong> Shadows shrink. Walk fast through cross-street gaps — fully exposed there.'
    : hour < 18
    ? '<strong>After 3pm:</strong> Sun moves SW. Building shadows shift to the east pavement. Consider crossing sides.'
    : '<strong>Evening:</strong> Both sides comfortable. Best time for a long walk.';
  document.getElementById('tip-line').innerHTML = tip;
}

/* ═══════════════════════════════════════════
   OVERPASS — fetch real centreline geometry
   Falls back silently to hardcoded nodes
   ═══════════════════════════════════════════ */
async function fetchCentreline() {
  const q = `[out:json][timeout:20];
way["name"="שד' רוטשילד"]["highway"](32.053,34.769,32.074,34.782);
out geom;`;
  try {
    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'data=' + encodeURIComponent(q)
    });
    if (!res.ok) return;
    const data = await res.json();
    let nodes = [];
    data.elements
      .filter(e => e.type === 'way' && e.geometry?.length > 1)
      .forEach(e => e.geometry.forEach(n => nodes.push([n.lat, n.lon])));
    if (nodes.length < 4) return;

    // Sort N→S and deduplicate within 2m
    nodes.sort((a, b) => b[0] - a[0]);
    const dedup = [nodes[0]];
    for (let i = 1; i < nodes.length; i++) {
      const p = dedup[dedup.length - 1];
      const MPD = 111320, cosLat = Math.cos(p[0] * Math.PI / 180);
      const d = Math.hypot((nodes[i][0] - p[0]) * MPD, (nodes[i][1] - p[1]) * MPD * cosLat);
      if (d > 2) dedup.push(nodes[i]);
    }

    walkNodes = offsetPolyline(dedup, 8);
    map.getSource('route').setData(routeGeoJSON());
    map.getSource('trees').setData(buildTreeGeoJSON());
  } catch (_) {
    // Silently keep hardcoded fallback
  }
}

/* ═══════════════════════════════════════════
   CONTROLS
   ═══════════════════════════════════════════ */
document.getElementById('tsl').addEventListener('input', function () {
  hour = parseFloat(this.value);
  document.getElementById('tval').textContent = fmtH(hour);
  if (map.loaded()) updateAll();
});

document.querySelectorAll('.sb').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.sb').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    season = b.dataset.s;
    if (map.loaded()) updateAll();
  });
});
</script>
</body>
</html>
