<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Shade Walk · Rothschild</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #f5f5f5;
    /* Type spec pulled from reference site:
       - font-family: nb_internationalproregular (paid) → Inter as closest free equivalent
       - 14 px / 21.98 px line-height / rgb(0,0,0) / weight 400 / letter-spacing normal */
    font-family: 'Inter', 'nb_internationalproregular', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 21.98px;
    font-weight: 400;
    letter-spacing: normal;
    color: rgb(0, 0, 0);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  p, .stack > * + * { margin-block-end: 15px; }
  #map { position: fixed; inset: 0; z-index: 0; background: #e5e5e5; }
  .leaflet-container { background: #e5e7eb; font-family: inherit; }

  #topbar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 1000;
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 99px;
    padding: 8px 8px 8px 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    font-size: 12px;
  }
  #topbar .brand { font-weight: 600; }
  #topbar input[type=date] {
    border: 1px solid rgba(0,0,0,0.1); border-radius: 99px;
    padding: 5px 10px; font-size: 11px; font-family: inherit;
    background: #fff;
  }
  #topbar input[type=range] {
    -webkit-appearance: none; width: 160px; height: 2px;
    background: rgba(0,0,0,0.15); border-radius: 2px; outline: none;
  }
  #topbar input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #111; cursor: pointer;
  }
  #time-display { min-width: 76px; font-weight: 600; }

  .btn {
    border: 1px solid rgba(0,0,0,0.1);
    background: #111; color: #fff;
    padding: 6px 14px; border-radius: 99px;
    font-size: 11px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: #000; }
  .btn.ghost { background: #fff; color: #111; }
  .btn.ghost:hover { background: #f3f4f6; }

  #rail {
    position: fixed; right: 16px; top: 50%; transform: translateY(-50%);
    z-index: 1000; display: flex; flex-direction: column; gap: 8px;
  }
  .rail-btn {
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(255,255,255,0.96);
    border: 1px solid rgba(0,0,0,0.08);
    font-size: 18px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .rail-btn.on { background: #111; color: #fff; border-color: #111; }
  .rail-btn:hover:not(.on) { background: #fff; }

  #status {
    position: fixed; left: 16px; bottom: 16px; z-index: 1000;
    background: rgba(255,255,255,0.96);
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 11px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    line-height: 1.5;
    max-width: 280px;
  }
  #status .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    vertical-align: middle; margin-right: 6px; background: #9ca3af;
  }
  #status code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 10px; }

  .panel {
    position: fixed; z-index: 1100;
    background: rgba(255,255,255,0.98);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    color: #111;
  }
  #bld-panel {
    top: 80px; left: 50%; transform: translateX(-50%);
    width: 320px; padding: 18px; display: none;
  }
  #tree-panel {
    top: 80px; right: 80px; bottom: 24px;
    width: 320px; display: none; flex-direction: column;
    overflow: hidden;
  }
  #tree-panel .head {
    padding: 16px 18px; border-bottom: 1px solid rgba(0,0,0,0.06);
    display: flex; justify-content: space-between; align-items: center;
  }
  #tree-panel .body { padding: 12px 18px; overflow-y: auto; flex: 1; }

  .panel h3 { font-size: 13px; font-weight: 600; }
  .panel .close {
    background: transparent; border: none; font-size: 20px;
    cursor: pointer; color: rgba(0,0,0,0.4); padding: 0; width: 24px;
  }
  .panel .close:hover { color: #111; }
  .panel label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    color: rgba(0,0,0,0.5); display: block; margin-top: 14px; margin-bottom: 6px;
  }
  .panel input[type=range] {
    -webkit-appearance: none; width: 100%; height: 2px;
    background: rgba(0,0,0,0.15); border-radius: 2px; outline: none;
  }
  .panel input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #111; cursor: pointer;
  }
  .readout { font-size: 13px; margin: 8px 0 4px; }
  .readout strong { font-weight: 700; }
  #bld-meta {
    font-size: 11px; color: rgba(0,0,0,0.6); margin-top: 6px;
    padding: 8px 10px; background: #f9fafb; border-radius: 8px;
  }

  .density-row { display: flex; gap: 4px; margin: 4px 0 8px; }
  .density-row button {
    flex: 1; padding: 8px 4px; font-size: 10px; font-family: inherit;
    background: #f3f4f6; border: 1px solid rgba(0,0,0,0.08);
    color: #6b7280; border-radius: 8px; cursor: pointer;
    text-transform: capitalize;
  }
  .density-row button:hover { background: #e5e7eb; }
  .density-row button.on { background: #111; color: #fff; border-color: #111; }
  .density-row button[title] { cursor: help; }

  .tree-card {
    background: #fafafa;
    border: 1px solid rgba(0,0,0,0.05);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .tree-card h4 { font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .tree-card .h-readout {
    display: flex; justify-content: space-between;
    font-size: 10px; color: rgba(0,0,0,0.5); margin: 6px 0 2px;
  }
  .tree-card .h-readout strong { color: #111; font-weight: 600; }

  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions .btn { flex: 1; padding: 8px 12px; font-size: 11px; text-align: center; }

  .overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.7);
    z-index: 9999; display: flex; align-items: center; justify-content: center;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 2px solid rgba(0,0,0,0.1);
    border-top-color: #111;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay .text { margin-left: 14px; font-size: 13px; color: #111; }

  .leaflet-tooltip {
    background: rgba(255,255,255,0.98) !important;
    color: #111 !important;
    border: 1px solid rgba(0,0,0,0.08) !important;
    border-radius: 8px !important;
    font-size: 11px !important;
    padding: 6px 10px !important;
    line-height: 1.5 !important;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12) !important;
  }
  .leaflet-tooltip::before { display: none !important; }

  /* ─── MOBILE ─── */
  @media (max-width: 720px) {
    #topbar {
      top: 8px; left: 8px; right: 8px; transform: none;
      padding: 8px 10px;
      gap: 8px;
      flex-wrap: wrap;
      border-radius: 14px;
      max-width: none;
    }
    #topbar .brand { font-size: 11px; width: 100%; }
    #topbar input[type=range] { width: auto; flex: 1; min-width: 100px; }
    #time-display { min-width: 60px; font-size: 11px; }
    #topbar input[type=date] { font-size: 10px; padding: 4px 8px; }
    .btn { padding: 6px 10px; font-size: 10px; }

    #rail {
      right: 8px; bottom: 8px; top: auto; transform: none;
      flex-direction: row; gap: 6px;
    }
    .rail-btn {
      width: 40px; height: 40px; border-radius: 10px;
      font-size: 17px;
    }

    #status {
      left: 8px; right: auto; bottom: 8px; max-width: calc(60% - 16px);
      padding: 8px 10px; font-size: 10px; border-radius: 10px;
    }

    #bld-panel, #tree-panel {
      top: 76px; left: 8px; right: 8px; width: auto; max-width: none;
      transform: none;
    }
    #tree-panel { top: 76px; bottom: 76px; right: 60px; }

    .panel { border-radius: 12px; }
    .ep-body, #tree-panel .body { padding: 10px 12px; }
    .panel h3 { font-size: 12px; }
    .panel label { font-size: 9px; }

    .tree-card { padding: 10px; margin-bottom: 8px; }
    .tree-card h4 { font-size: 11px; }
    .density-row button { padding: 10px 4px; font-size: 10px; }

    .overlay .text { font-size: 12px; }
  }

  /* ─── LARGE TAP TARGETS ─── */
  @media (pointer: coarse) {
    #topbar input[type=range]::-webkit-slider-thumb { width: 22px; height: 22px; }
    .panel input[type=range]::-webkit-slider-thumb { width: 22px; height: 22px; }
    .tb-density button, .density-row button { min-height: 36px; }
    .rail-btn { min-height: 44px; min-width: 44px; }
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <span class="brand">🌿 Shade Walk · Rothschild</span>
  <input type="date" id="date-pick" />
  <input type="range" id="time-slider" min="5" max="20" step="0.166" value="9">
  <span id="time-display">9:00 am</span>
  <button class="btn" id="run-shade">Compute day shade</button>
</div>

<div id="rail">
  <button class="rail-btn" id="open-trees" title="Edit tree blocks">🌳</button>
  <button class="rail-btn" id="best-path" title="Show the shadiest side at this time">🧭</button>
  <button class="rail-btn" id="toggle-heatmap" title="Toggle day-shade heatmap">👁</button>
</div>

<div id="status">
  <div><span class="dot" id="gis-dot"></span><span id="gis-text">Connecting to TLV GIS…</span></div>
  <div id="bld-count" style="opacity:0.6; margin-top:4px;"></div>
  <div id="best-path-out" style="display:none; margin-top:6px; padding-top:6px; border-top:1px solid rgba(0,0,0,0.08); font-weight:600;"></div>
  <div style="margin-top:6px; padding-top:6px; border-top:1px solid rgba(0,0,0,0.08); font-size:11px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
    <span>
      <a href="#" id="export-edits" style="color:#2563eb; text-decoration:none;">⬇ Export</a> ·
      <a href="#" id="import-edits" style="color:#2563eb; text-decoration:none;">⬆ Import</a>
    </span>
    <a href="3d.html" style="color:#2563eb; text-decoration:none;">3D →</a>
  </div>
</div>

<div class="panel" id="bld-panel">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h3 id="bld-title">Building</h3>
    <button class="close" id="bld-close">×</button>
  </div>
  <div id="bld-meta">–</div>
  <label>Floors</label>
  <input type="range" id="bld-slider" min="1" max="50" step="1" value="4">
  <div class="readout">
    <span id="bld-floors">4</span> floors × 4 m = <strong><span id="bld-meters">16</span> m</strong>
  </div>
  <div class="actions">
    <button class="btn" id="bld-save">Save</button>
    <button class="btn ghost" id="bld-reset">Clear override</button>
  </div>
</div>

<div class="panel" id="tree-panel">
  <div class="head">
    <h3>Tree blocks</h3>
    <button class="close" id="tree-close">×</button>
  </div>
  <div class="body" id="tree-list"></div>
</div>

<div id="loading" class="overlay">
  <div class="spinner"></div>
  <div class="text">Loading…</div>
</div>

<div id="computing" class="overlay" style="display:none;">
  <div class="spinner"></div>
  <div class="text" id="compute-text">Accumulating shadows…</div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════
   Shade Walk · Rothschild Boulevard, Tel Aviv
   Inputs:  TLV GIS building footprints + manual tree block data.
   Outputs: clickable building floor editor, tree block editor, and
            a sun-path engine that accumulates 10-min shadow projections
            into a duration heatmap.
   ════════════════════════════════════════════════════════════════════ */

const TLV_LAT = 32.07, TLV_LON = 34.78;
const FLOOR_M = 4;
const GIS_PROXY = 'http://localhost:5001';

/* Building heights along Rothschild Boulevard, keyed by street number.
   Source: provided by the user. Matched to OSM footprints via the
   addr:housenumber + addr:street tags during loadBuildings(). */
const ROTHSCHILD_HEIGHTS = {
  '1':  120.2,
  '2':   12,  '4':   12,  '6':   12,  '8':   13,  '10':  13,
  '12':  13,  '14':  13,  '16':  13,  '18':  16,  '20':  16,
  '22': 126.9,'24':  18,  '26':  18,  '28':  18,  '30': 102,
  '32':  22,  '34':  22,  '36': 158,  '38':  18,  '40':  18,
  '42': 132,  '44':  18,  '46':  20,  '48':  18,  '50':  18,
  '52':  18,  '54':  20,  '56': 126.9,'58':  18,  '60':  18,
  '62':  18,  '64':  18,  '66':  18,  '68':  18,  '70':  18,
  '72':  18,  '74':  18,  '76':  18,  '78':  18,  '80':  18,
  '82':  18,  '84':  18,  '86':  18,  '88':  18,  '90':  18,
  '92':  18,  '94':  18,  '96':  18,  '98':  18, '100':  18,
  '102': 18, '104':  18, '106':  18, '108':  18, '110':  18,
  '112': 18, '114':  18, '116':  18, '118':  18, '120':  18,
  '122': 18, '124':  18, '126':  18, '128':  18, '130':  18,
  '132': 18, '134':  18, '136':  18, '138':  18,
};

/* Special tower at 46 Rothschild — distinct from the lower building
   at the same address. Matched by lat/lon since it shares an address. */
const MATCH_RADIUS_M = 50;
const LANDMARK_TOWERS = [
  { name: '46 Rothschild Tower', addr: '46 Rothschild', lat: 32.06440, lon: 34.77410, floors: 25, h: 93 },
];

/* Cross-streets on Rothschild, north → south.
   Coordinates are best-effort approximations; edit them here if a block
   boundary looks off on the map. */
/* Approximate coords along the real SW-curving path of Rothschild.
   These are only used as hints — each crossing is snapped to the
   nearest vertex on the OSM polyline. The CURVE matters, not the
   exact coords. */
let CROSSINGS = [
  { name: 'Habima Square',    lat: 32.072005, lon: 34.779269 }, // north terminus (user-provided)
  { name: 'Hashmonaim',       lat: 32.070462, lon: 34.778764 }, // user-provided
  { name: 'Bar Ilan',         lat: 32.069575, lon: 34.778488 }, // user-provided
  { name: 'Sheinkin',         lat: 32.068122, lon: 34.778053 }, // user-provided
  { name: 'Balfour',          lat: 32.066594, lon: 34.777564 }, // user-provided
  { name: 'Mazeh',            lat: 32.065918, lon: 34.777274 }, // user-provided
  { name: 'Nahmani',          lat: 32.065360, lon: 34.776731 }, // user-provided
  { name: 'Betzalel Yaffe',   lat: 32.064307, lon: 34.775531 }, // user-provided
  { name: 'Yavne',            lat: 32.063745, lon: 34.773747 }, // user-provided
  { name: 'Allenby',          lat: 32.063511, lon: 34.772919 }, // user-provided
  { name: 'Nahalat Binyamin', lat: 32.063169, lon: 34.771650 }, // user-provided
  { name: 'Herzl',            lat: 32.062962, lon: 34.770005 }, // south terminus (user-provided)
];

/* OSM name patterns (Hebrew + English) for each crossing.
   Used to find the actual intersection node on the Rothschild way. */
const CROSSING_PATTERNS = {
  'Hashmonaim':      'החשמונאים|Hashmonaim',
  'Bar Ilan':        'בר.אילן|Bar.Ilan',
  'Sheinkin':        'שינקין|Sheinkin',
  'Balfour':         'בלפור|Balfour',
  'Mazeh':           'מאז.ה|Mazeh',
  'Nahmani':         'נחמני|Nahmani|Nachmani',
  'Betzalel Yaffe':  'בצלאל.יפה|Betzalel|Bezalel',
  'Yavne':           'יבנה|Yavne',
  'Allenby':         'אלנבי|Allenby',
  'Nahalat Binyamin':'נחלת.בנימין|Nahalat|Nachalat',
  'Herzl':           'הרצל|Herzl',
};

const DENSITY_FACTOR  = { none: 0,        sparse: 0.32, medium: 0.55, dense: 0.85 };
const TREE_SPACING_M  = { none: Infinity, sparse: 20,   medium: 12,   dense: 8   };
const DENSITY_TIP = {
  none:   'No trees on this block',
  sparse: 'Canopy covers ~30% of the walkway',
  medium: 'Canopy covers ~50% of the walkway',
  dense:  'Canopy covers most of the walkway',
};
/* Real Rothschild ficus: ~14–18 m tall, 10–14 m canopy diameter. */
const BLOCK_DEFAULTS = { density: 'dense', h: 16, canopy: 12 };

/* Block-specific overrides applied when the user hasn't edited that
   block yet. Captures the qualitative notes from the brief:
   - Habima end: trimmed, narrow canopy
   - One block has no trees
   - Herzl → Ahad Ha'am: sparse */
const BLOCK_PRESETS = {
  // Habima end: tall + trimmed narrow canopy
  'Habima Square→Hashmonaim': { density: 'medium', h: 16, canopy: 4 },
  // Section B: sparse stretch — Nahalat Binyamin to Herzl
  'Nahalat Binyamin→Herzl':   { density: 'sparse', h: 12, canopy: 8 },
};

const KEY_BLD  = 'shade-walk:v2:buildings';
const KEY_TREE = 'shade-walk:v2:trees';
const lsLoad = k => { try { return JSON.parse(localStorage.getItem(k) || '{}'); } catch { return {}; } };
const lsSave = (k, o) => localStorage.setItem(k, JSON.stringify(o));
let buildingOverrides = lsLoad(KEY_BLD);
let treeOverrides     = lsLoad(KEY_TREE);

let map, footprintLyr, shadowLyr, heatmapLyr, treeLyr;
let buildings = [];
let boulevardPolyline = null; // [[lat, lon], ...] — real OSM centreline
let editingBuilding = null;
let heatmapDate = null, heatmapOn = false;
let currentDate = new Date();
let hour = 9;

/* ───── Sun: NOAA-style with DST via Intl ───── */
function tlvOffsetHours(date) {
  try {
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Jerusalem', timeZoneName: 'longOffset',
      year: 'numeric', month: 'numeric', day: 'numeric'
    });
    const tz = fmt.formatToParts(date).find(p => p.type === 'timeZoneName')?.value || 'GMT+02:00';
    const m = tz.match(/GMT([+-])(\d{1,2}):?(\d{2})?/);
    if (!m) return 2;
    return (m[1] === '+' ? 1 : -1) * (parseInt(m[2]) + parseInt(m[3] || 0) / 60);
  } catch { return 2; }
}
function getSun(date, localHour) {
  const start = new Date(date.getFullYear(), 0, 0);
  const doy = Math.floor((date - start) / 86400000);
  const declDeg = 23.45 * Math.sin(2 * Math.PI * (284 + doy) / 365);
  const decl = declDeg * Math.PI / 180;
  const B = 2 * Math.PI * (doy - 81) / 365;
  const eot = 9.87 * Math.sin(2*B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  const offsetH = tlvOffsetHours(date);
  const stdMeridian = 15 * offsetH;
  const solarHour = localHour + (4 * (TLV_LON - stdMeridian) + eot) / 60;
  const ha = (solarHour - 12) * 15 * Math.PI / 180;
  const lat = TLV_LAT * Math.PI / 180;
  const sinA = Math.sin(lat)*Math.sin(decl) + Math.cos(lat)*Math.cos(decl)*Math.cos(ha);
  const altR = Math.asin(Math.max(-1, Math.min(1, sinA)));
  const altD = altR * 180 / Math.PI;
  const cosZ = (Math.sin(decl) - Math.sin(lat)*sinA) / (Math.cos(lat)*Math.cos(altR));
  let az = Math.acos(Math.max(-1, Math.min(1, cosZ))) * 180 / Math.PI;
  if (ha > 0) az = 360 - az;
  // Shadow-length multiplier: 1/tan(altitude), capped at 8 so that
  // low-sun shadows don't stretch beyond the map. Below 1° treat as
  // "no meaningful shadow" (up=false) — sun this low is atmospheric
  // scatter, not a directional light source.
  const rawLen = altD > 0.5 ? 1 / Math.tan(altR) : 8;
  return { alt: altD, az, len: Math.min(8, rawLen), up: altD > 1, offsetH };
}

/* ───── Geometry ───── */
function polyCentroid(poly) {
  const lats = poly.map(p => p[0]), lons = poly.map(p => p[1]);
  return [
    (Math.min(...lats) + Math.max(...lats)) / 2,
    (Math.min(...lons) + Math.max(...lons)) / 2,
  ];
}
/* Andrew's monotone-chain convex hull in [lat, lon] space.
   Lat/lon scales are close enough at this latitude for the hull
   to come out right visually. */
function convexHull(points) {
  if (points.length < 3) return points.slice();
  const pts = points.slice().sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  const cross = (O, A, B) =>
    (A[1] - O[1]) * (B[0] - O[0]) - (A[0] - O[0]) * (B[1] - O[1]);
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 &&
           cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 &&
           cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
    upper.push(p);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

/* Shadow envelope: hull of (footprint ∪ footprint translated by sun vector × height). */
function castShadow(poly, h, dLat, dLon) {
  const sdLat = dLat * h, sdLon = dLon * h;
  const translated = poly.map(p => [p[0] + sdLat, p[1] + sdLon]);
  return convexHull([...poly, ...translated]);
}

function blockPolygon(blk, widthM = 12) {
  const MPD = 111320;
  const latC = Math.cos(TLV_LAT * Math.PI / 180);
  const dN = (blk.b.lat - blk.a.lat) * MPD;
  const dE = (blk.b.lon - blk.a.lon) * MPD * latC;
  const bearing = Math.atan2(dE, dN);
  const perpL = bearing - Math.PI / 2;
  const half = widthM / 2;
  const dLat = (Math.cos(perpL) * half) / MPD;
  const dLon = (Math.sin(perpL) * half) / (MPD * latC);
  return [
    [blk.a.lat + dLat, blk.a.lon + dLon],
    [blk.b.lat + dLat, blk.b.lon + dLon],
    [blk.b.lat - dLat, blk.b.lon - dLon],
    [blk.a.lat - dLat, blk.a.lon - dLon],
  ];
}

function getTreeBlocks() {
  const out = [];
  for (let i = 0; i < CROSSINGS.length - 1; i++) {
    const a = CROSSINGS[i], b = CROSSINGS[i+1];
    const key = `${a.name}→${b.name}`;
    const preset = BLOCK_PRESETS[key] || {};
    const dflt = { ...BLOCK_DEFAULTS, ...preset };
    const ovr = treeOverrides[key] || {};
    out.push({
      key,
      label: `${a.name} → ${b.name}`,
      density: ovr.density || dflt.density,
      h:       ovr.h      != null ? ovr.h      : dflt.h,
      canopy:  ovr.canopy != null ? ovr.canopy : dflt.canopy,
      override: !!treeOverrides[key],
      a, b,
    });
  }
  return out;
}

/* Tree centres evenly spaced along the block — TWO rows, one on each
   side of the centreline, offset perpendicular to the boulevard
   bearing by ~ROW_OFFSET_M. */
/* Two parallel rows of trees on the median, ±ROW_OFFSET_M from
   its centreline. 8 m spans the full width of the green boulevard. */
const ROW_OFFSET_M = 8;

/* Distance in metres between two [lat, lon] points. */
function distM(a, b) {
  const dN = (a[0] - b[0]) * 111320;
  const dE = (a[1] - b[1]) * 111320 * Math.cos(a[0] * Math.PI / 180);
  return Math.hypot(dN, dE);
}

/* Index of the polyline vertex closest to (lat, lon). */
function nearestPolylineIndex(poly, lat, lon) {
  let bestI = 0, bestD = Infinity;
  for (let i = 0; i < poly.length; i++) {
    const d = distM(poly[i], [lat, lon]);
    if (d < bestD) { bestD = d; bestI = i; }
  }
  return bestI;
}

/* Walk along a polyline segment placing trees every `spacing` metres.
   Both rows are on the median side of the polyline (asymmetric offset),
   so trees flank the central walkable strip, not the road we follow. */
function placeTreesAlongSegment(segment, spacing) {
  if (!segment || segment.length < 2) return [];
  const MPD = 111320;
  const latC = Math.cos(TLV_LAT * Math.PI / 180);
  const positions = [];
  let accum = 0;
  let nextAt = spacing / 2;
  for (let i = 0; i < segment.length - 1; i++) {
    const p1 = segment[i], p2 = segment[i + 1];
    const dN = (p2[0] - p1[0]) * MPD;
    const dE = (p2[1] - p1[1]) * MPD * latC;
    const segLen = Math.hypot(dN, dE);
    if (segLen < 0.001) continue;
    const bearing = Math.atan2(dE, dN);
    const perp = bearing - Math.PI / 2;
    const offLat = (Math.cos(perp) * ROW_OFFSET_M) / MPD;
    const offLon = (Math.sin(perp) * ROW_OFFSET_M) / (MPD * latC);
    while (nextAt <= accum + segLen) {
      const t = (nextAt - accum) / segLen;
      const cx = p1[0] + (p2[0] - p1[0]) * t;
      const cy = p1[1] + (p2[1] - p1[1]) * t;
      positions.push([cx + offLat, cy + offLon]);
      positions.push([cx - offLat, cy - offLon]);
      nextAt += spacing;
    }
    accum += segLen;
  }
  return positions;
}

/* Tree positions for a block — walks the real boulevard polyline
   between the two crossings' projected positions. Falls back to a
   straight-line interpolation if the polyline hasn't loaded yet. */
function getTreePositions(blk) {
  if (blk.density === 'none') return [];
  const spacing = TREE_SPACING_M[blk.density];
  if (!isFinite(spacing)) return [];

  if (boulevardPolyline && boulevardPolyline.length >= 2) {
    const aIdx = nearestPolylineIndex(boulevardPolyline, blk.a.lat, blk.a.lon);
    const bIdx = nearestPolylineIndex(boulevardPolyline, blk.b.lat, blk.b.lon);
    const lo = Math.min(aIdx, bIdx), hi = Math.max(aIdx, bIdx);
    const segment = boulevardPolyline.slice(lo, hi + 1);
    return placeTreesAlongSegment(segment, spacing);
  }
  // Fallback: straight line between approximate crossings
  return placeTreesAlongSegment([[blk.a.lat, blk.a.lon], [blk.b.lat, blk.b.lon]], spacing);
}

/* Polygon approximation of a circle on the ground, radius in metres. */
function circlePolygon(center, radiusM, n = 12) {
  const MPD = 111320;
  const latC = Math.cos(center[0] * Math.PI / 180);
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * 2 * Math.PI;
    out.push([
      center[0] + (radiusM * Math.sin(a)) / MPD,
      center[1] + (radiusM * Math.cos(a)) / (MPD * latC),
    ]);
  }
  return out;
}

function resolveBuildingHeight(b) {
  const ovr = buildingOverrides[b.id];
  if (ovr) return { h: ovr.h, src: 'manual', floors: ovr.floors,
                    notes: `${ovr.floors} floors × ${FLOOR_M}m = ${ovr.h}m` };
  return { h: b.h, src: 'default', floors: Math.round(b.h / FLOOR_M),
           notes: `Default — not yet set` };
}

/* ───── Map ───── */
function initMap() {
  map = L.map('map', {
    center: [32.0640, 34.7745],
    zoom: 16,
    zoomControl: false,
  });
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://openstreetmap.org">OSM</a> © <a href="https://carto.com">CARTO</a>',
    subdomains: 'abcd', maxZoom: 19,
  }).addTo(map);
  shadowLyr    = L.layerGroup().addTo(map);
  treeLyr      = L.layerGroup().addTo(map);
  footprintLyr = L.layerGroup().addTo(map);
  heatmapLyr   = L.layerGroup();
}

/* Tree canopies — visible always, independent of sun. */
function drawTreeCanopies() {
  treeLyr.clearLayers();
  getTreeBlocks().forEach(blk => {
    getTreePositions(blk).forEach(pos => {
      L.polygon(circlePolygon(pos, blk.canopy / 2, 16), {
        fillColor: '#16a34a', fillOpacity: 0.7,
        color: '#14532d', weight: 1, opacity: 0.85,
        interactive: false
      }).addTo(treeLyr);
    });
  });
}

/* ───── Footprints from OpenStreetMap (Overpass) ─────
   We use OSM ONLY for the polygon outlines of buildings near
   Rothschild. Heights are NOT taken from OSM — every building
   defaults to a placeholder height until the user sets floors
   via the slider. */
const DEFAULT_FLOORS = 4;            // 4 floors × 4 m = 16 m starting point
const ROTHSCHILD_BBOX = '32.053,34.765,32.075,34.781';

/* Fetch the real Rothschild centreline from OSM and stitch its way
   segments into a single polyline. Stored as boulevardPolyline. */
/* Boulevard polyline straight from the user-supplied CROSSINGS coords.
   All 12 points are ground-truth lat/lons, so no OSM stitching is
   needed (and it was actively hurting accuracy in the middle stretch). */
function buildBoulevard() {
  boulevardPolyline = CROSSINGS.map(c => [c.lat, c.lon]);
  console.log(`Boulevard: ${boulevardPolyline.length} ground-truth crossings`);
}

async function loadBuildings() {
  setStatus('pending');
  const q = `[out:json][timeout:25];(way["building"](${ROTHSCHILD_BBOX}););out geom;`;
  try {
    const r = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'data=' + encodeURIComponent(q),
      signal: AbortSignal.timeout(30000),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    buildings = (data.elements || [])
      .filter(e => e.type === 'way' && e.geometry && e.geometry.length >= 3)
      .map(e => {
        const poly = e.geometry.map(p => [p.lat, p.lon]);
        const tags = e.tags || {};
        return {
          id: `osm-${e.id}`,
          poly,
          centroid: polyCentroid(poly),
          h: DEFAULT_FLOORS * FLOOR_M,
          notes: `Default: ${DEFAULT_FLOORS} floors. Click to edit.`,
          addrStreet: tags['addr:street'] || '',
          addrNumber: tags['addr:housenumber'] || '',
        };
      });
    applyRothschildPresets();
    applyLandmarkTowers();
    setStatus('ok');
  } catch (err) {
    console.warn('Footprint load failed:', err);
    buildings = [];
    setStatus('offline');
  }
  drawFootprints();
  drawTreeCanopies();
  updateShadows();
  document.getElementById('loading').style.display = 'none';
}

/* Auto-populate Rothschild building heights by matching the
   OSM addr:housenumber tag against the user-provided table. */
function applyRothschildPresets() {
  let matched = 0;
  buildings.forEach(b => {
    const street = b.addrStreet || '';
    const isRothschild =
      street.includes('רוטשילד') ||
      street.toLowerCase().includes('rothschild');
    if (!isRothschild) return;
    const num = b.addrNumber;
    const h = ROTHSCHILD_HEIGHTS[num];
    if (h == null) return;
    b.addr = `${num} Rothschild`;
    const existing = buildingOverrides[b.id];
    if (!existing || existing.preset) {
      buildingOverrides[b.id] = {
        h, floors: Math.round(h / FLOOR_M), preset: true,
      };
      matched++;
    }
  });
  lsSave(KEY_BLD, buildingOverrides);
  console.log(`Applied Rothschild presets to ${matched} buildings.`);
}

/* Match each landmark tower to the nearest OSM footprint by centroid
   distance and pre-populate its override if the user hasn't set one. */
function applyLandmarkTowers() {
  const latC = Math.cos(TLV_LAT * Math.PI / 180);
  LANDMARK_TOWERS.forEach(lm => {
    let best = null, bestDist = Infinity;
    for (const b of buildings) {
      const dLat = (b.centroid[0] - lm.lat) * 111320;
      const dLon = (b.centroid[1] - lm.lon) * 111320 * latC;
      const dist = Math.hypot(dLat, dLon);
      if (dist < bestDist) { bestDist = dist; best = b; }
    }
    if (!best || bestDist > MATCH_RADIUS_M) return;
    best.name = lm.name;
    best.addr = lm.addr;
    if (!buildingOverrides[best.id]) {
      buildingOverrides[best.id] = { floors: lm.floors, h: lm.h, preset: true };
    }
  });
  lsSave(KEY_BLD, buildingOverrides);
}

function setStatus(s) {
  const txt = document.getElementById('gis-text');
  const dot = document.getElementById('gis-dot');
  const edited = Object.keys(buildingOverrides).length;
  if (s === 'ok') {
    txt.innerHTML = `<b>${buildings.length} buildings</b> loaded · click any to set floors`;
    dot.style.background = '#16a34a';
  } else if (s === 'offline') {
    txt.innerHTML = `<b>Failed to load building footprints.</b> Check your internet connection.`;
    dot.style.background = '#dc2626';
  } else {
    txt.textContent = 'Loading building footprints…';
    dot.style.background = '#9ca3af';
  }
  document.getElementById('bld-count').textContent =
    edited ? `${edited} edited so far` : '';
}

/* ───── Footprints (always clickable) ───── */
function drawFootprints() {
  footprintLyr.clearLayers();
  buildings.forEach(b => {
    const r = resolveBuildingHeight(b);
    const c = r.src === 'manual' ? '#2563eb' : '#0ea5e9';
    L.polygon(b.poly, {
      fillColor: c, fillOpacity: 0.18,
      color: c, weight: 1, opacity: 0.6,
    })
      .bindTooltip(
        `<b>${b.name || b.addr || 'Building'}</b><br>` +
        `${r.floors} floors · <b>${Math.round(r.h)} m</b>` +
        (r.src === 'manual' ? ' <span style="color:#2563eb">(edited)</span>' : ' <span style="opacity:0.6">(default)</span>') +
        `<br><span style="opacity:0.5; font-size:10px;">Click to set floors</span>`,
        { sticky: true }
      )
      .on('click', () => openBldEditor(b))
      .addTo(footprintLyr);
  });
}

/* ───── Current-time shadows (live, redraw on slider) ───── */
function updateShadows() {
  shadowLyr.clearLayers();
  const sun = getSun(currentDate, hour);
  document.getElementById('time-display').textContent =
    fmtTime(hour) + (sun.up ? ` · ${Math.round(sun.alt)}°` : ' · below horizon');
  if (!sun.up || sun.alt < 1) return;
  const MPD = 111320, latC = Math.cos(TLV_LAT * Math.PI / 180);
  const az = sun.az * Math.PI / 180;
  const dLat = -Math.cos(az) * sun.len / MPD;
  const dLon =  Math.sin(az) * sun.len / (MPD * latC);

  // Fade shadows as the sun gets low — real low-sun shadows are
  // diffuse/soft, so we lower their alpha proportionally.
  //   altitude ≥ 25°  → full opacity
  //   altitude ≤ 5°   → 40 %
  const altFade = Math.max(0.4, Math.min(1, (sun.alt - 5) / 20));

  buildings.forEach(b => {
    const h = resolveBuildingHeight(b).h;
    const env = castShadow(b.poly, h, dLat, dLon);
    L.polygon(env, {
      fillColor: '#0b0f19',
      fillOpacity: altFade * Math.min(0.55, 0.25 + (h/55)*0.30),
      color: 'transparent', interactive: false
    }).addTo(shadowLyr);
  });

  // Per-tree shadows. Each tree is a vertical cylinder of canopy
  // diameter; its shadow is the convex hull of the canopy disc
  // and that disc translated by the sun vector × tree height.
  getTreeBlocks().forEach(blk => {
    const r = blk.canopy / 2;
    const dens = DENSITY_FACTOR[blk.density] || 0.5;
    getTreePositions(blk).forEach(pos => {
      const canopyPoly = circlePolygon(pos, r, 12);
      const env = castShadow(canopyPoly, blk.h, dLat, dLon);
      L.polygon(env, {
        fillColor: '#14532d',
        fillOpacity: altFade * (0.18 + 0.30 * dens),
        color: 'transparent', interactive: false
      }).addTo(shadowLyr);
    });
  });
  // They're not drawn as live polygons here, because the per-block
  // geometry is derived from approximate crossing coordinates and would
  // otherwise draw a misaligned green stripe across the map.
}

/* ───── Day-shade heatmap: accumulated shadow polygons ─────
   For each 10-min step, project each footprint + each tree-block
   canopy along the solar vector at low alpha. Stacking gives a
   shadow-duration heatmap with no extra computation. */
/* ───── Shadiest-path analyzer ─────
   Generates east and west walking paths (offset perpendicular to
   the boulevard centreline), samples each at 3 m intervals, and
   for the current sun position counts what fraction of samples
   fall inside a building shadow (binary) or a tree shadow
   (weighted by density). Higher fraction = shadier path. */
const WALK_OFFSET_M = 10;
let bestPathLayer = null;

function offsetPolyline(polyline, offsetM) {
  const MPD = 111320;
  const latC = Math.cos(TLV_LAT * Math.PI / 180);
  const out = [];
  for (let i = 0; i < polyline.length; i++) {
    const prev = polyline[Math.max(0, i - 1)];
    const next = polyline[Math.min(polyline.length - 1, i + 1)];
    const dN = (next[0] - prev[0]) * MPD;
    const dE = (next[1] - prev[1]) * MPD * latC;
    const bearing = Math.atan2(dE, dN);
    const perp = bearing - Math.PI / 2;
    const offLat = (Math.cos(perp) * offsetM) / MPD;
    const offLon = (Math.sin(perp) * offsetM) / (MPD * latC);
    out.push([polyline[i][0] + offLat, polyline[i][1] + offLon]);
  }
  return out;
}

function samplePolyline(polyline, stepM = 3) {
  const MPD = 111320, latC = Math.cos(TLV_LAT * Math.PI / 180);
  const samples = [];
  for (let i = 0; i < polyline.length - 1; i++) {
    const p1 = polyline[i], p2 = polyline[i + 1];
    const dN = (p2[0] - p1[0]) * MPD;
    const dE = (p2[1] - p1[1]) * MPD * latC;
    const segLen = Math.hypot(dN, dE);
    const n = Math.max(1, Math.ceil(segLen / stepM));
    for (let s = 0; s < n; s++) {
      const t = s / n;
      samples.push([
        p1[0] + (p2[0] - p1[0]) * t,
        p1[1] + (p2[1] - p1[1]) * t,
      ]);
    }
  }
  samples.push(polyline[polyline.length - 1]);
  return samples;
}

function computePathShade(path, sun) {
  if (!sun.up || sun.alt < 1) return 0;
  const MPD = 111320, latC = Math.cos(TLV_LAT * Math.PI / 180);
  const az = sun.az * Math.PI / 180;
  const dLat = -Math.cos(az) * sun.len / MPD;
  const dLon =  Math.sin(az) * sun.len / (MPD * latC);

  const buildingShadows = buildings.map(b => {
    const h = resolveBuildingHeight(b).h;
    return castShadow(b.poly, h, dLat, dLon);
  });

  const treeShadows = [];
  getTreeBlocks().forEach(blk => {
    if (blk.density === 'none') return;
    const r = blk.canopy / 2;
    const dens = DENSITY_FACTOR[blk.density] || 0;
    getTreePositions(blk).forEach(pos => {
      const canopyPoly = circlePolygon(pos, r, 12);
      treeShadows.push({ env: castShadow(canopyPoly, blk.h, dLat, dLon), density: dens });
    });
  });

  const samples = samplePolyline(path, 3);
  let total = 0;
  for (const pt of samples) {
    if (buildingShadows.some(poly => pointInPolygon(pt, poly))) { total += 1; continue; }
    let treeS = 0;
    for (const t of treeShadows) {
      if (pointInPolygon(pt, t.env)) treeS = Math.max(treeS, t.density);
    }
    total += treeS;
  }
  return total / samples.length;
}

function showShadiestPath() {
  if (bestPathLayer) { map.removeLayer(bestPathLayer); bestPathLayer = null; }
  const out = document.getElementById('best-path-out');
  const btn = document.getElementById('best-path');

  if (btn.classList.contains('on')) {
    btn.classList.remove('on');
    out.style.display = 'none';
    return;
  }

  const sun = getSun(currentDate, hour);
  if (!sun.up || sun.alt < 1) {
    out.style.display = 'block';
    out.innerHTML = '☾ Sun is below the horizon — everywhere is shade.';
    btn.classList.add('on');
    return;
  }

  const east = offsetPolyline(boulevardPolyline, +WALK_OFFSET_M);
  const west = offsetPolyline(boulevardPolyline, -WALK_OFFSET_M);
  const eastShade = computePathShade(east, sun);
  const westShade = computePathShade(west, sun);

  const better = eastShade >= westShade ? { name: 'East side', path: east, shade: eastShade } : { name: 'West side', path: west, shade: westShade };
  const other  = eastShade >= westShade ? { name: 'West side', shade: westShade } : { name: 'East side', shade: eastShade };

  bestPathLayer = L.polyline(better.path, {
    color: '#16a34a', weight: 6, opacity: 0.85, lineCap: 'round', lineJoin: 'round',
    interactive: false,
  }).addTo(map);

  out.style.display = 'block';
  out.innerHTML =
    `🧭 <span style="color:#15803d">${better.name}</span> at ${fmtTime(hour)}<br>` +
    `<span style="font-weight:400; opacity:0.7">` +
    `${Math.round(better.shade * 100)}% shade · other side ${Math.round(other.shade * 100)}%` +
    `</span>`;
  btn.classList.add('on');
}

async function runHeatmap() {
  document.getElementById('computing').style.display = 'flex';
  await new Promise(r => setTimeout(r, 30));
  try {
    heatmapLyr.clearLayers();
    const renderer = L.canvas({ padding: 0.5 });
    const MPD = 111320, latC = Math.cos(TLV_LAT * Math.PI / 180);
    const bldgs = buildings.map(b => ({ poly: b.poly, h: resolveBuildingHeight(b).h }));
    const trees = [];
    getTreeBlocks().forEach(blk => {
      const dens = DENSITY_FACTOR[blk.density] || 0.4;
      getTreePositions(blk).forEach(pos => {
        trees.push({
          canopyPoly: circlePolygon(pos, blk.canopy / 2, 10),
          h: blk.h,
          densityFactor: dens,
        });
      });
    });

    for (let h = 5; h <= 20; h += 1/6) {
      const sun = getSun(currentDate, h);
      if (!sun.up || sun.alt < 3) continue;
      const az = sun.az * Math.PI / 180;
      const dLat = -Math.cos(az) * sun.len / MPD;
      const dLon =  Math.sin(az) * sun.len / (MPD * latC);

      for (const b of bldgs) {
        const env = castShadow(b.poly, b.h, dLat, dLon);
        L.polygon(env, {
          renderer, fillColor: '#0b0f19', fillOpacity: 0.035,
          color: 'transparent', interactive: false
        }).addTo(heatmapLyr);
      }
      for (const t of trees) {
        const env = castShadow(t.canopyPoly, t.h, dLat, dLon);
        L.polygon(env, {
          renderer, fillColor: '#14532d',
          fillOpacity: 0.035 * t.densityFactor,
          color: 'transparent', interactive: false
        }).addTo(heatmapLyr);
      }
    }
    heatmapDate = currentDate.getTime();
    heatmapOn = true;
    if (!map.hasLayer(heatmapLyr)) heatmapLyr.addTo(map);
    document.getElementById('toggle-heatmap').classList.add('on');
  } finally {
    document.getElementById('computing').style.display = 'none';
  }
}

/* ───── Building floor editor ───── */
function openBldEditor(b) {
  editingBuilding = b;
  const r = resolveBuildingHeight(b);
  document.getElementById('bld-title').textContent = `Building #${String(b.id).replace('gis-','')}`;
  document.getElementById('bld-meta').innerHTML =
    `Current: <strong>${Math.round(r.h)} m</strong> · <strong>${r.src.toUpperCase()}</strong><br>` +
    `<span style="opacity:0.7">${r.notes || ''}</span>`;
  const slider = document.getElementById('bld-slider');
  slider.value = r.floors;
  document.getElementById('bld-floors').textContent = r.floors;
  document.getElementById('bld-meters').textContent = r.floors * FLOOR_M;
  document.getElementById('bld-panel').style.display = 'block';
}
document.getElementById('bld-slider').addEventListener('input', () => {
  const f = parseInt(document.getElementById('bld-slider').value);
  document.getElementById('bld-floors').textContent = f;
  document.getElementById('bld-meters').textContent = f * FLOOR_M;
});
document.getElementById('bld-close').addEventListener('click', () => {
  document.getElementById('bld-panel').style.display = 'none';
  editingBuilding = null;
});
document.getElementById('bld-save').addEventListener('click', () => {
  if (!editingBuilding) return;
  const f = parseInt(document.getElementById('bld-slider').value);
  buildingOverrides[editingBuilding.id] = { floors: f, h: f * FLOOR_M };
  lsSave(KEY_BLD, buildingOverrides);
  document.getElementById('bld-panel').style.display = 'none';
  editingBuilding = null;
  setStatus(buildings.length ? 'ok' : 'offline');
  drawFootprints();
  updateShadows();
  heatmapDate = null;
  if (heatmapOn) runHeatmap();
});
document.getElementById('bld-reset').addEventListener('click', () => {
  if (!editingBuilding) return;
  delete buildingOverrides[editingBuilding.id];
  lsSave(KEY_BLD, buildingOverrides);
  document.getElementById('bld-panel').style.display = 'none';
  editingBuilding = null;
  setStatus(buildings.length ? 'ok' : 'offline');
  drawFootprints();
  updateShadows();
  heatmapDate = null;
  if (heatmapOn) runHeatmap();
});

/* ───── Tree block editor ───── */
function renderTreeEditor() {
  const root = document.getElementById('tree-list');
  const blocks = getTreeBlocks();
  root.innerHTML = blocks.map(blk => `
    <div class="tree-card" data-key="${blk.key}">
      <h4>${blk.label}${blk.override ? ' <span style="color:#16a34a;font-size:9px;font-weight:600;">EDITED</span>' : ''}</h4>
      <div class="density-row">
        ${['none','sparse','medium','dense'].map(d => `
          <button data-d="${d}" class="${blk.density === d ? 'on' : ''}" title="${DENSITY_TIP[d]}">${d}</button>
        `).join('')}
      </div>
      <div class="h-readout">
        <span>Tree height</span>
        <strong><span class="h-val">${blk.h}</span> m</strong>
      </div>
      <input type="range" class="h-sl" min="4" max="22" step="1" value="${blk.h}">
      <div class="h-readout" style="margin-top:8px;">
        <span>Canopy width</span>
        <strong><span class="c-val">${blk.canopy}</span> m</strong>
      </div>
      <input type="range" class="c-sl" min="2" max="16" step="1" value="${blk.canopy}">
    </div>
  `).join('');

  const commitOverride = (card, key) => {
    const cur = treeOverrides[key] || {};
    cur.density = card.querySelector('.density-row button.on')?.dataset.d || cur.density || 'medium';
    cur.h      = parseInt(card.querySelector('.h-sl').value);
    cur.canopy = parseInt(card.querySelector('.c-sl').value);
    treeOverrides[key] = cur;
    lsSave(KEY_TREE, treeOverrides);
    drawTreeCanopies();
    updateShadows();
    heatmapDate = null;
    if (heatmapOn) runHeatmap();
  };

  root.querySelectorAll('.tree-card').forEach(card => {
    const key = card.dataset.key;
    card.querySelectorAll('.density-row button').forEach(btn => {
      btn.addEventListener('click', () => {
        card.querySelectorAll('.density-row button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        commitOverride(card, key);
        renderTreeEditor();
      });
    });
    const hSl = card.querySelector('.h-sl'), hOut = card.querySelector('.h-val');
    hSl.addEventListener('input', () => hOut.textContent = hSl.value);
    hSl.addEventListener('change', () => commitOverride(card, key));
    const cSl = card.querySelector('.c-sl'), cOut = card.querySelector('.c-val');
    cSl.addEventListener('input', () => cOut.textContent = cSl.value);
    cSl.addEventListener('change', () => commitOverride(card, key));
  });
}
document.getElementById('open-trees').addEventListener('click', () => {
  const p = document.getElementById('tree-panel');
  if (p.style.display === 'flex') { p.style.display = 'none'; return; }
  renderTreeEditor();
  p.style.display = 'flex';
});
document.getElementById('tree-close').addEventListener('click', () => {
  document.getElementById('tree-panel').style.display = 'none';
});

/* ───── Top bar handlers ───── */
const fmtTime = h => {
  const hh = Math.floor(h);
  const mm = Math.round((h - hh) * 60).toString().padStart(2, '0');
  const ap = hh < 12 ? 'am' : 'pm';
  const d = hh > 12 ? hh - 12 : (hh === 0 ? 12 : hh);
  return `${d}:${mm} ${ap}`;
};
const dateToISO = d =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

document.getElementById('time-slider').addEventListener('input', (e) => {
  hour = Math.round(parseFloat(e.target.value) * 6) / 6;
  updateShadows();
  if (document.getElementById('best-path').classList.contains('on')) {
    document.getElementById('best-path').classList.remove('on');
    showShadiestPath();
  }
});
document.getElementById('date-pick').addEventListener('change', (e) => {
  if (!e.target.value) return;
  const [y, m, d] = e.target.value.split('-').map(Number);
  currentDate = new Date(y, m-1, d);
  updateShadows();
  heatmapDate = null;
  if (heatmapOn) runHeatmap();
});
document.getElementById('run-shade').addEventListener('click', runHeatmap);
document.getElementById('best-path').addEventListener('click', showShadiestPath);

/* ───── Export / Import edits (shared JSON, cross-device) ───── */
function exportEdits(e) {
  if (e) e.preventDefault();
  const bundle = {
    version: 'shade-walk:v2',
    exportedAt: new Date().toISOString(),
    buildings: JSON.parse(localStorage.getItem(KEY_BLD)  || '{}'),
    trees:     JSON.parse(localStorage.getItem(KEY_TREE) || '{}'),
  };
  const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), {
    href: url,
    download: `shade-walk-edits-${new Date().toISOString().slice(0,10)}.json`,
  });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function importEdits(e) {
  if (e) e.preventDefault();
  const input = Object.assign(document.createElement('input'), {
    type: 'file', accept: 'application/json,.json',
  });
  input.onchange = async () => {
    const file = input.files?.[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (data.buildings && typeof data.buildings === 'object') {
        localStorage.setItem(KEY_BLD, JSON.stringify(data.buildings));
      }
      if (data.trees && typeof data.trees === 'object') {
        localStorage.setItem(KEY_TREE, JSON.stringify(data.trees));
      }
      alert('Imported. Reloading…');
      location.reload();
    } catch (err) {
      alert('Import failed: ' + err.message);
    }
  };
  input.click();
}
document.getElementById('export-edits').addEventListener('click', exportEdits);
document.getElementById('import-edits').addEventListener('click', importEdits);
document.getElementById('toggle-heatmap').addEventListener('click', () => {
  heatmapOn = !heatmapOn;
  const btn = document.getElementById('toggle-heatmap');
  btn.classList.toggle('on', heatmapOn);
  if (heatmapOn) {
    if (heatmapDate !== currentDate.getTime()) { runHeatmap(); return; }
    if (!map.hasLayer(heatmapLyr)) heatmapLyr.addTo(map);
  } else {
    if (map.hasLayer(heatmapLyr)) map.removeLayer(heatmapLyr);
  }
});

/* ───── Boot ───── */
window.addEventListener('load', () => {
  document.getElementById('date-pick').value = dateToISO(currentDate);
  document.getElementById('time-display').textContent = fmtTime(hour);
  initMap();
  setTimeout(async () => {
    map.invalidateSize();
    buildBoulevard();
    await loadBuildings();
  }, 100);
});
</script>
