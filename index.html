<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shade Walk · Rothschild</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #111;
  }
  #map { position: fixed; inset: 0; z-index: 0; background: #e5e5e5; }
  .leaflet-container { background: #e5e7eb; font-family: inherit; }

  #topbar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 1000;
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 99px;
    padding: 8px 8px 8px 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    font-size: 12px;
  }
  #topbar .brand { font-weight: 600; }
  #topbar input[type=date] {
    border: 1px solid rgba(0,0,0,0.1); border-radius: 99px;
    padding: 5px 10px; font-size: 11px; font-family: inherit;
    background: #fff;
  }
  #topbar input[type=range] {
    -webkit-appearance: none; width: 160px; height: 2px;
    background: rgba(0,0,0,0.15); border-radius: 2px; outline: none;
  }
  #topbar input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #111; cursor: pointer;
  }
  #time-display { min-width: 76px; font-weight: 600; }

  .btn {
    border: 1px solid rgba(0,0,0,0.1);
    background: #111; color: #fff;
    padding: 6px 14px; border-radius: 99px;
    font-size: 11px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: #000; }
  .btn.ghost { background: #fff; color: #111; }
  .btn.ghost:hover { background: #f3f4f6; }

  #rail {
    position: fixed; right: 16px; top: 50%; transform: translateY(-50%);
    z-index: 1000; display: flex; flex-direction: column; gap: 8px;
  }
  .rail-btn {
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(255,255,255,0.96);
    border: 1px solid rgba(0,0,0,0.08);
    font-size: 18px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .rail-btn.on { background: #111; color: #fff; border-color: #111; }
  .rail-btn:hover:not(.on) { background: #fff; }

  #status {
    position: fixed; left: 16px; bottom: 16px; z-index: 1000;
    background: rgba(255,255,255,0.96);
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 11px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    line-height: 1.5;
    max-width: 280px;
  }
  #status .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    vertical-align: middle; margin-right: 6px; background: #9ca3af;
  }
  #status code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 10px; }

  .panel {
    position: fixed; z-index: 1100;
    background: rgba(255,255,255,0.98);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    color: #111;
  }
  #bld-panel {
    top: 80px; left: 50%; transform: translateX(-50%);
    width: 320px; padding: 18px; display: none;
  }
  #tree-panel {
    top: 80px; right: 80px; bottom: 24px;
    width: 320px; display: none; flex-direction: column;
    overflow: hidden;
  }
  #tree-panel .head {
    padding: 16px 18px; border-bottom: 1px solid rgba(0,0,0,0.06);
    display: flex; justify-content: space-between; align-items: center;
  }
  #tree-panel .body { padding: 12px 18px; overflow-y: auto; flex: 1; }

  .panel h3 { font-size: 13px; font-weight: 600; }
  .panel .close {
    background: transparent; border: none; font-size: 20px;
    cursor: pointer; color: rgba(0,0,0,0.4); padding: 0; width: 24px;
  }
  .panel .close:hover { color: #111; }
  .panel label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    color: rgba(0,0,0,0.5); display: block; margin-top: 14px; margin-bottom: 6px;
  }
  .panel input[type=range] {
    -webkit-appearance: none; width: 100%; height: 2px;
    background: rgba(0,0,0,0.15); border-radius: 2px; outline: none;
  }
  .panel input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #111; cursor: pointer;
  }
  .readout { font-size: 13px; margin: 8px 0 4px; }
  .readout strong { font-weight: 700; }
  #bld-meta {
    font-size: 11px; color: rgba(0,0,0,0.6); margin-top: 6px;
    padding: 8px 10px; background: #f9fafb; border-radius: 8px;
  }

  .density-row { display: flex; gap: 4px; margin: 4px 0 8px; }
  .density-row button {
    flex: 1; padding: 8px 4px; font-size: 10px; font-family: inherit;
    background: #f3f4f6; border: 1px solid rgba(0,0,0,0.08);
    color: #6b7280; border-radius: 8px; cursor: pointer;
    text-transform: capitalize;
  }
  .density-row button:hover { background: #e5e7eb; }
  .density-row button.on { background: #111; color: #fff; border-color: #111; }
  .density-row button[title] { cursor: help; }

  .tree-card {
    background: #fafafa;
    border: 1px solid rgba(0,0,0,0.05);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .tree-card h4 { font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .tree-card .h-readout {
    display: flex; justify-content: space-between;
    font-size: 10px; color: rgba(0,0,0,0.5); margin: 6px 0 2px;
  }
  .tree-card .h-readout strong { color: #111; font-weight: 600; }

  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions .btn { flex: 1; padding: 8px 12px; font-size: 11px; text-align: center; }

  .overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.7);
    z-index: 9999; display: flex; align-items: center; justify-content: center;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 2px solid rgba(0,0,0,0.1);
    border-top-color: #111;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay .text { margin-left: 14px; font-size: 13px; color: #111; }

  .leaflet-tooltip {
    background: rgba(255,255,255,0.98) !important;
    color: #111 !important;
    border: 1px solid rgba(0,0,0,0.08) !important;
    border-radius: 8px !important;
    font-size: 11px !important;
    padding: 6px 10px !important;
    line-height: 1.5 !important;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12) !important;
  }
  .leaflet-tooltip::before { display: none !important; }
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <span class="brand">🌿 Shade Walk · Rothschild</span>
  <input type="date" id="date-pick" />
  <input type="range" id="time-slider" min="5" max="20" step="0.166" value="9">
  <span id="time-display">9:00 am</span>
  <button class="btn" id="run-shade">Compute day shade</button>
</div>

<div id="rail">
  <button class="rail-btn" id="open-trees" title="Edit tree blocks">🌳</button>
  <button class="rail-btn" id="toggle-heatmap" title="Toggle day-shade heatmap">👁</button>
</div>

<div id="status">
  <div><span class="dot" id="gis-dot"></span><span id="gis-text">Connecting to TLV GIS…</span></div>
  <div id="bld-count" style="opacity:0.6; margin-top:4px;"></div>
</div>

<div class="panel" id="bld-panel">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h3 id="bld-title">Building</h3>
    <button class="close" id="bld-close">×</button>
  </div>
  <div id="bld-meta">–</div>
  <label>Floors</label>
  <input type="range" id="bld-slider" min="1" max="50" step="1" value="4">
  <div class="readout">
    <span id="bld-floors">4</span> floors × 4 m = <strong><span id="bld-meters">16</span> m</strong>
  </div>
  <div class="actions">
    <button class="btn" id="bld-save">Save</button>
    <button class="btn ghost" id="bld-reset">Clear override</button>
  </div>
</div>

<div class="panel" id="tree-panel">
  <div class="head">
    <h3>Tree blocks</h3>
    <button class="close" id="tree-close">×</button>
  </div>
  <div class="body" id="tree-list"></div>
</div>

<div id="loading" class="overlay">
  <div class="spinner"></div>
  <div class="text">Loading…</div>
</div>

<div id="computing" class="overlay" style="display:none;">
  <div class="spinner"></div>
  <div class="text" id="compute-text">Accumulating shadows…</div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════
   Shade Walk · Rothschild Boulevard, Tel Aviv
   Inputs:  TLV GIS building footprints + manual tree block data.
   Outputs: clickable building floor editor, tree block editor, and
            a sun-path engine that accumulates 10-min shadow projections
            into a duration heatmap.
   ════════════════════════════════════════════════════════════════════ */

const TLV_LAT = 32.07, TLV_LON = 34.78;
const FLOOR_M = 4;
const GIS_PROXY = 'http://localhost:5001';

/* Known tall towers on Rothschild — used to pre-populate manual
   heights/floors on first load. Lat/lon are approximate; we match
   to the nearest OSM footprint within MATCH_RADIUS_M. */
const MATCH_RADIUS_M = 50;
const LANDMARK_TOWERS = [
  { name: 'Meier on Rothschild',              addr: '36 Rothschild', lat: 32.06657, lon: 34.77545, floors: 42, h: 158 },
  { name: 'First International Bank Tower',   addr: '42 Rothschild', lat: 32.06520, lon: 34.77470, floors: 32, h: 132 },
  { name: 'Rothschild 22 Tower',              addr: '22 Rothschild', lat: 32.06830, lon: 34.77650, floors: 29, h: 127 },
  { name: 'Aviv Rothschild Tower',            addr: '56 Rothschild', lat: 32.06350, lon: 34.77380, floors: 30, h: 125 },
  { name: '1 Rothschild Boulevard',           addr: '1 Rothschild',  lat: 32.07100, lon: 34.77780, floors: 34, h: 125 },
];

/* Cross-streets on Rothschild, north → south.
   Coordinates are best-effort approximations; edit them here if a block
   boundary looks off on the map. */
const CROSSINGS = [
  { name: 'Habima',      lat: 32.07301, lon: 34.77783 },
  { name: 'Marmorek',    lat: 32.07153, lon: 34.77737 },
  { name: 'Mazeh',       lat: 32.06961, lon: 34.77692 },
  { name: 'Sheinkin',    lat: 32.06820, lon: 34.77619 },
  { name: 'Allenby',     lat: 32.06660, lon: 34.77556 },
  { name: 'Balfour',     lat: 32.06544, lon: 34.77503 },
  { name: 'Nachmani',    lat: 32.06425, lon: 34.77451 },
  { name: 'Brenner',     lat: 32.06320, lon: 34.77383 },
  { name: 'Herzl',       lat: 32.06182, lon: 34.77302 },
  { name: "Ahad Ha'am",  lat: 32.06046, lon: 34.77223 },
  { name: 'Yavne',       lat: 32.05907, lon: 34.77138 },
  { name: 'Lilienblum',  lat: 32.05823, lon: 34.77086 },
  { name: 'Neve Tzedek', lat: 32.05750, lon: 34.77035 },
];

const DENSITY_FACTOR  = { sparse: 0.32, medium: 0.55, dense: 0.85 };
const TREE_SPACING_M  = { sparse: 18,    medium: 10,    dense: 6   }; // metres between trees
const DENSITY_TIP = {
  sparse: 'Canopy covers ~30% of the walkway',
  medium: 'Canopy covers ~50% of the walkway',
  dense:  'Canopy covers most of the walkway',
};
const BLOCK_DEFAULTS = { density: 'medium', h: 12, canopy: 6 };

const KEY_BLD  = 'shade-walk:v2:buildings';
const KEY_TREE = 'shade-walk:v2:trees';
const lsLoad = k => { try { return JSON.parse(localStorage.getItem(k) || '{}'); } catch { return {}; } };
const lsSave = (k, o) => localStorage.setItem(k, JSON.stringify(o));
let buildingOverrides = lsLoad(KEY_BLD);
let treeOverrides     = lsLoad(KEY_TREE);

let map, footprintLyr, shadowLyr, heatmapLyr;
let buildings = [];
let editingBuilding = null;
let heatmapDate = null, heatmapOn = false;
let currentDate = new Date();
let hour = 9;

/* ───── Sun: NOAA-style with DST via Intl ───── */
function tlvOffsetHours(date) {
  try {
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Jerusalem', timeZoneName: 'longOffset',
      year: 'numeric', month: 'numeric', day: 'numeric'
    });
    const tz = fmt.formatToParts(date).find(p => p.type === 'timeZoneName')?.value || 'GMT+02:00';
    const m = tz.match(/GMT([+-])(\d{1,2}):?(\d{2})?/);
    if (!m) return 2;
    return (m[1] === '+' ? 1 : -1) * (parseInt(m[2]) + parseInt(m[3] || 0) / 60);
  } catch { return 2; }
}
function getSun(date, localHour) {
  const start = new Date(date.getFullYear(), 0, 0);
  const doy = Math.floor((date - start) / 86400000);
  const declDeg = 23.45 * Math.sin(2 * Math.PI * (284 + doy) / 365);
  const decl = declDeg * Math.PI / 180;
  const B = 2 * Math.PI * (doy - 81) / 365;
  const eot = 9.87 * Math.sin(2*B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  const offsetH = tlvOffsetHours(date);
  const stdMeridian = 15 * offsetH;
  const solarHour = localHour + (4 * (TLV_LON - stdMeridian) + eot) / 60;
  const ha = (solarHour - 12) * 15 * Math.PI / 180;
  const lat = TLV_LAT * Math.PI / 180;
  const sinA = Math.sin(lat)*Math.sin(decl) + Math.cos(lat)*Math.cos(decl)*Math.cos(ha);
  const altR = Math.asin(Math.max(-1, Math.min(1, sinA)));
  const altD = altR * 180 / Math.PI;
  const cosZ = (Math.sin(decl) - Math.sin(lat)*sinA) / (Math.cos(lat)*Math.cos(altR));
  let az = Math.acos(Math.max(-1, Math.min(1, cosZ))) * 180 / Math.PI;
  if (ha > 0) az = 360 - az;
  return { alt: altD, az, len: altD > 1 ? 1/Math.tan(altR) : 30, up: altD > 0, offsetH };
}

/* ───── Geometry ───── */
function polyCentroid(poly) {
  const lats = poly.map(p => p[0]), lons = poly.map(p => p[1]);
  return [
    (Math.min(...lats) + Math.max(...lats)) / 2,
    (Math.min(...lons) + Math.max(...lons)) / 2,
  ];
}
/* Andrew's monotone-chain convex hull in [lat, lon] space.
   Lat/lon scales are close enough at this latitude for the hull
   to come out right visually. */
function convexHull(points) {
  if (points.length < 3) return points.slice();
  const pts = points.slice().sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  const cross = (O, A, B) =>
    (A[1] - O[1]) * (B[0] - O[0]) - (A[0] - O[0]) * (B[1] - O[1]);
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 &&
           cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 &&
           cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
    upper.push(p);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

/* Shadow envelope: hull of (footprint ∪ footprint translated by sun vector × height). */
function castShadow(poly, h, dLat, dLon) {
  const sdLat = dLat * h, sdLon = dLon * h;
  const translated = poly.map(p => [p[0] + sdLat, p[1] + sdLon]);
  return convexHull([...poly, ...translated]);
}

function blockPolygon(blk, widthM = 12) {
  const MPD = 111320;
  const latC = Math.cos(TLV_LAT * Math.PI / 180);
  const dN = (blk.b.lat - blk.a.lat) * MPD;
  const dE = (blk.b.lon - blk.a.lon) * MPD * latC;
  const bearing = Math.atan2(dE, dN);
  const perpL = bearing - Math.PI / 2;
  const half = widthM / 2;
  const dLat = (Math.cos(perpL) * half) / MPD;
  const dLon = (Math.sin(perpL) * half) / (MPD * latC);
  return [
    [blk.a.lat + dLat, blk.a.lon + dLon],
    [blk.b.lat + dLat, blk.b.lon + dLon],
    [blk.b.lat - dLat, blk.b.lon - dLon],
    [blk.a.lat - dLat, blk.a.lon - dLon],
  ];
}

function getTreeBlocks() {
  const out = [];
  for (let i = 0; i < CROSSINGS.length - 1; i++) {
    const a = CROSSINGS[i], b = CROSSINGS[i+1];
    const key = `${a.name}→${b.name}`;
    const ovr = treeOverrides[key] || {};
    out.push({
      key,
      label: `${a.name} → ${b.name}`,
      density: ovr.density || BLOCK_DEFAULTS.density,
      h:       ovr.h      != null ? ovr.h      : BLOCK_DEFAULTS.h,
      canopy:  ovr.canopy != null ? ovr.canopy : BLOCK_DEFAULTS.canopy,
      override: !!treeOverrides[key],
      a, b,
    });
  }
  return out;
}

/* Tree centres evenly spaced along the block — TWO rows, one on each
   side of the centreline, offset perpendicular to the boulevard
   bearing by ~ROW_OFFSET_M. */
const ROW_OFFSET_M = 6; // distance from centreline to each tree row

function getTreePositions(blk) {
  const MPD = 111320;
  const latC = Math.cos(TLV_LAT * Math.PI / 180);
  const dN = (blk.b.lat - blk.a.lat) * MPD;
  const dE = (blk.b.lon - blk.a.lon) * MPD * latC;
  const lengthM = Math.hypot(dN, dE);
  const bearing = Math.atan2(dE, dN);
  const perp = bearing - Math.PI / 2;
  const dLat = (Math.cos(perp) * ROW_OFFSET_M) / MPD;
  const dLon = (Math.sin(perp) * ROW_OFFSET_M) / (MPD * latC);
  const spacing = TREE_SPACING_M[blk.density] || 10;
  const n = Math.max(1, Math.floor(lengthM / spacing));
  const positions = [];
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n;
    const cx = blk.a.lat + (blk.b.lat - blk.a.lat) * t;
    const cy = blk.a.lon + (blk.b.lon - blk.a.lon) * t;
    positions.push([cx + dLat, cy + dLon]); // left row
    positions.push([cx - dLat, cy - dLon]); // right row
  }
  return positions;
}

/* Polygon approximation of a circle on the ground, radius in metres. */
function circlePolygon(center, radiusM, n = 12) {
  const MPD = 111320;
  const latC = Math.cos(center[0] * Math.PI / 180);
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * 2 * Math.PI;
    out.push([
      center[0] + (radiusM * Math.sin(a)) / MPD,
      center[1] + (radiusM * Math.cos(a)) / (MPD * latC),
    ]);
  }
  return out;
}

function resolveBuildingHeight(b) {
  const ovr = buildingOverrides[b.id];
  if (ovr) return { h: ovr.h, src: 'manual', floors: ovr.floors,
                    notes: `${ovr.floors} floors × ${FLOOR_M}m = ${ovr.h}m` };
  return { h: b.h, src: 'default', floors: Math.round(b.h / FLOOR_M),
           notes: `Default — not yet set` };
}

/* ───── Map ───── */
function initMap() {
  map = L.map('map', {
    center: [32.0640, 34.7745],
    zoom: 16,
    zoomControl: false,
  });
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://openstreetmap.org">OSM</a> © <a href="https://carto.com">CARTO</a>',
    subdomains: 'abcd', maxZoom: 19,
  }).addTo(map);
  shadowLyr    = L.layerGroup().addTo(map);
  treeLyr      = L.layerGroup().addTo(map);
  footprintLyr = L.layerGroup().addTo(map);
  heatmapLyr   = L.layerGroup();
}

/* Tree canopies — visible always, independent of sun. */
function drawTreeCanopies() {
  treeLyr.clearLayers();
  getTreeBlocks().forEach(blk => {
    getTreePositions(blk).forEach(pos => {
      L.polygon(circlePolygon(pos, blk.canopy / 2, 14), {
        fillColor: '#16a34a', fillOpacity: 0.55,
        color: '#166534', weight: 0.8, opacity: 0.7,
        interactive: false
      }).addTo(treeLyr);
    });
  });
}

/* ───── Footprints from OpenStreetMap (Overpass) ─────
   We use OSM ONLY for the polygon outlines of buildings near
   Rothschild. Heights are NOT taken from OSM — every building
   defaults to a placeholder height until the user sets floors
   via the slider. */
const DEFAULT_FLOORS = 4;            // 4 floors × 4 m = 16 m starting point
const ROTHSCHILD_BBOX = '32.053,34.765,32.075,34.781';

async function loadBuildings() {
  setStatus('pending');
  const q = `[out:json][timeout:25];(way["building"](${ROTHSCHILD_BBOX}););out geom;`;
  try {
    const r = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'data=' + encodeURIComponent(q),
      signal: AbortSignal.timeout(30000),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    buildings = (data.elements || [])
      .filter(e => e.type === 'way' && e.geometry && e.geometry.length >= 3)
      .map(e => {
        const poly = e.geometry.map(p => [p.lat, p.lon]);
        return {
          id: `osm-${e.id}`,
          poly,
          centroid: polyCentroid(poly),
          h: DEFAULT_FLOORS * FLOOR_M,
          notes: `Default: ${DEFAULT_FLOORS} floors. Click to edit.`,
        };
      });
    applyLandmarkTowers();
    setStatus('ok');
  } catch (err) {
    console.warn('Footprint load failed:', err);
    buildings = [];
    setStatus('offline');
  }
  drawFootprints();
  drawTreeCanopies();
  updateShadows();
  document.getElementById('loading').style.display = 'none';
}

/* Match each landmark tower to the nearest OSM footprint by centroid
   distance and pre-populate its override if the user hasn't set one. */
function applyLandmarkTowers() {
  const latC = Math.cos(TLV_LAT * Math.PI / 180);
  LANDMARK_TOWERS.forEach(lm => {
    let best = null, bestDist = Infinity;
    for (const b of buildings) {
      const dLat = (b.centroid[0] - lm.lat) * 111320;
      const dLon = (b.centroid[1] - lm.lon) * 111320 * latC;
      const dist = Math.hypot(dLat, dLon);
      if (dist < bestDist) { bestDist = dist; best = b; }
    }
    if (!best || bestDist > MATCH_RADIUS_M) return;
    best.name = lm.name;
    best.addr = lm.addr;
    if (!buildingOverrides[best.id]) {
      buildingOverrides[best.id] = { floors: lm.floors, h: lm.h, preset: true };
    }
  });
  lsSave(KEY_BLD, buildingOverrides);
}

function setStatus(s) {
  const txt = document.getElementById('gis-text');
  const dot = document.getElementById('gis-dot');
  const edited = Object.keys(buildingOverrides).length;
  if (s === 'ok') {
    txt.innerHTML = `<b>${buildings.length} buildings</b> loaded · click any to set floors`;
    dot.style.background = '#16a34a';
  } else if (s === 'offline') {
    txt.innerHTML = `<b>Failed to load building footprints.</b> Check your internet connection.`;
    dot.style.background = '#dc2626';
  } else {
    txt.textContent = 'Loading building footprints…';
    dot.style.background = '#9ca3af';
  }
  document.getElementById('bld-count').textContent =
    edited ? `${edited} edited so far` : '';
}

/* ───── Footprints (always clickable) ───── */
function drawFootprints() {
  footprintLyr.clearLayers();
  buildings.forEach(b => {
    const r = resolveBuildingHeight(b);
    const c = r.src === 'manual' ? '#2563eb' : '#0ea5e9';
    L.polygon(b.poly, {
      fillColor: c, fillOpacity: 0.18,
      color: c, weight: 1, opacity: 0.6,
    })
      .bindTooltip(
        `<b>${b.name || b.addr || 'Building'}</b><br>` +
        `${r.floors} floors · <b>${Math.round(r.h)} m</b>` +
        (r.src === 'manual' ? ' <span style="color:#2563eb">(edited)</span>' : ' <span style="opacity:0.6">(default)</span>') +
        `<br><span style="opacity:0.5; font-size:10px;">Click to set floors</span>`,
        { sticky: true }
      )
      .on('click', () => openBldEditor(b))
      .addTo(footprintLyr);
  });
}

/* ───── Current-time shadows (live, redraw on slider) ───── */
function updateShadows() {
  shadowLyr.clearLayers();
  const sun = getSun(currentDate, hour);
  document.getElementById('time-display').textContent =
    fmtTime(hour) + (sun.up ? ` · ${Math.round(sun.alt)}°` : ' · below horizon');
  if (!sun.up || sun.alt < 1) return;
  const MPD = 111320, latC = Math.cos(TLV_LAT * Math.PI / 180);
  const az = sun.az * Math.PI / 180;
  const dLat = -Math.cos(az) * sun.len / MPD;
  const dLon =  Math.sin(az) * sun.len / (MPD * latC);

  buildings.forEach(b => {
    const h = resolveBuildingHeight(b).h;
    const env = castShadow(b.poly, h, dLat, dLon);
    L.polygon(env, {
      fillColor: '#0b0f19',
      fillOpacity: Math.min(0.55, 0.25 + (h/55)*0.30),
      color: 'transparent', interactive: false
    }).addTo(shadowLyr);
  });

  // Per-tree shadows. Each tree is a vertical cylinder of canopy
  // diameter; its shadow is the convex hull of the canopy disc
  // and that disc translated by the sun vector × tree height.
  getTreeBlocks().forEach(blk => {
    const r = blk.canopy / 2;
    const dens = DENSITY_FACTOR[blk.density] || 0.5;
    getTreePositions(blk).forEach(pos => {
      const canopyPoly = circlePolygon(pos, r, 12);
      const env = castShadow(canopyPoly, blk.h, dLat, dLon);
      L.polygon(env, {
        fillColor: '#14532d',
        fillOpacity: 0.18 + 0.30 * dens,
        color: 'transparent', interactive: false
      }).addTo(shadowLyr);
    });
  });
  // They're not drawn as live polygons here, because the per-block
  // geometry is derived from approximate crossing coordinates and would
  // otherwise draw a misaligned green stripe across the map.
}

/* ───── Day-shade heatmap: accumulated shadow polygons ─────
   For each 10-min step, project each footprint + each tree-block
   canopy along the solar vector at low alpha. Stacking gives a
   shadow-duration heatmap with no extra computation. */
async function runHeatmap() {
  document.getElementById('computing').style.display = 'flex';
  await new Promise(r => setTimeout(r, 30));
  try {
    heatmapLyr.clearLayers();
    const renderer = L.canvas({ padding: 0.5 });
    const MPD = 111320, latC = Math.cos(TLV_LAT * Math.PI / 180);
    const bldgs = buildings.map(b => ({ poly: b.poly, h: resolveBuildingHeight(b).h }));
    const trees = [];
    getTreeBlocks().forEach(blk => {
      const dens = DENSITY_FACTOR[blk.density] || 0.4;
      getTreePositions(blk).forEach(pos => {
        trees.push({
          canopyPoly: circlePolygon(pos, blk.canopy / 2, 10),
          h: blk.h,
          densityFactor: dens,
        });
      });
    });

    for (let h = 5; h <= 20; h += 1/6) {
      const sun = getSun(currentDate, h);
      if (!sun.up || sun.alt < 3) continue;
      const az = sun.az * Math.PI / 180;
      const dLat = -Math.cos(az) * sun.len / MPD;
      const dLon =  Math.sin(az) * sun.len / (MPD * latC);

      for (const b of bldgs) {
        const env = castShadow(b.poly, b.h, dLat, dLon);
        L.polygon(env, {
          renderer, fillColor: '#0b0f19', fillOpacity: 0.035,
          color: 'transparent', interactive: false
        }).addTo(heatmapLyr);
      }
      for (const t of trees) {
        const env = castShadow(t.canopyPoly, t.h, dLat, dLon);
        L.polygon(env, {
          renderer, fillColor: '#14532d',
          fillOpacity: 0.035 * t.densityFactor,
          color: 'transparent', interactive: false
        }).addTo(heatmapLyr);
      }
    }
    heatmapDate = currentDate.getTime();
    heatmapOn = true;
    if (!map.hasLayer(heatmapLyr)) heatmapLyr.addTo(map);
    document.getElementById('toggle-heatmap').classList.add('on');
  } finally {
    document.getElementById('computing').style.display = 'none';
  }
}

/* ───── Building floor editor ───── */
function openBldEditor(b) {
  editingBuilding = b;
  const r = resolveBuildingHeight(b);
  document.getElementById('bld-title').textContent = `Building #${String(b.id).replace('gis-','')}`;
  document.getElementById('bld-meta').innerHTML =
    `Current: <strong>${Math.round(r.h)} m</strong> · <strong>${r.src.toUpperCase()}</strong><br>` +
    `<span style="opacity:0.7">${r.notes || ''}</span>`;
  const slider = document.getElementById('bld-slider');
  slider.value = r.floors;
  document.getElementById('bld-floors').textContent = r.floors;
  document.getElementById('bld-meters').textContent = r.floors * FLOOR_M;
  document.getElementById('bld-panel').style.display = 'block';
}
document.getElementById('bld-slider').addEventListener('input', () => {
  const f = parseInt(document.getElementById('bld-slider').value);
  document.getElementById('bld-floors').textContent = f;
  document.getElementById('bld-meters').textContent = f * FLOOR_M;
});
document.getElementById('bld-close').addEventListener('click', () => {
  document.getElementById('bld-panel').style.display = 'none';
  editingBuilding = null;
});
document.getElementById('bld-save').addEventListener('click', () => {
  if (!editingBuilding) return;
  const f = parseInt(document.getElementById('bld-slider').value);
  buildingOverrides[editingBuilding.id] = { floors: f, h: f * FLOOR_M };
  lsSave(KEY_BLD, buildingOverrides);
  document.getElementById('bld-panel').style.display = 'none';
  editingBuilding = null;
  setStatus(buildings.length ? 'ok' : 'offline');
  drawFootprints();
  updateShadows();
  heatmapDate = null;
  if (heatmapOn) runHeatmap();
});
document.getElementById('bld-reset').addEventListener('click', () => {
  if (!editingBuilding) return;
  delete buildingOverrides[editingBuilding.id];
  lsSave(KEY_BLD, buildingOverrides);
  document.getElementById('bld-panel').style.display = 'none';
  editingBuilding = null;
  setStatus(buildings.length ? 'ok' : 'offline');
  drawFootprints();
  updateShadows();
  heatmapDate = null;
  if (heatmapOn) runHeatmap();
});

/* ───── Tree block editor ───── */
function renderTreeEditor() {
  const root = document.getElementById('tree-list');
  const blocks = getTreeBlocks();
  root.innerHTML = blocks.map(blk => `
    <div class="tree-card" data-key="${blk.key}">
      <h4>${blk.label}${blk.override ? ' <span style="color:#16a34a;font-size:9px;font-weight:600;">EDITED</span>' : ''}</h4>
      <div class="density-row">
        ${['sparse','medium','dense'].map(d => `
          <button data-d="${d}" class="${blk.density === d ? 'on' : ''}" title="${DENSITY_TIP[d]}">${d}</button>
        `).join('')}
      </div>
      <div class="h-readout">
        <span>Tree height</span>
        <strong><span class="h-val">${blk.h}</span> m</strong>
      </div>
      <input type="range" class="h-sl" min="4" max="18" step="1" value="${blk.h}">
      <div class="h-readout" style="margin-top:8px;">
        <span>Canopy width</span>
        <strong><span class="c-val">${blk.canopy}</span> m</strong>
      </div>
      <input type="range" class="c-sl" min="2" max="10" step="1" value="${blk.canopy}">
    </div>
  `).join('');

  const commitOverride = (card, key) => {
    const cur = treeOverrides[key] || {};
    cur.density = card.querySelector('.density-row button.on')?.dataset.d || cur.density || 'medium';
    cur.h      = parseInt(card.querySelector('.h-sl').value);
    cur.canopy = parseInt(card.querySelector('.c-sl').value);
    treeOverrides[key] = cur;
    lsSave(KEY_TREE, treeOverrides);
    drawTreeCanopies();
    updateShadows();
    heatmapDate = null;
    if (heatmapOn) runHeatmap();
  };

  root.querySelectorAll('.tree-card').forEach(card => {
    const key = card.dataset.key;
    card.querySelectorAll('.density-row button').forEach(btn => {
      btn.addEventListener('click', () => {
        card.querySelectorAll('.density-row button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        commitOverride(card, key);
        renderTreeEditor();
      });
    });
    const hSl = card.querySelector('.h-sl'), hOut = card.querySelector('.h-val');
    hSl.addEventListener('input', () => hOut.textContent = hSl.value);
    hSl.addEventListener('change', () => commitOverride(card, key));
    const cSl = card.querySelector('.c-sl'), cOut = card.querySelector('.c-val');
    cSl.addEventListener('input', () => cOut.textContent = cSl.value);
    cSl.addEventListener('change', () => commitOverride(card, key));
  });
}
document.getElementById('open-trees').addEventListener('click', () => {
  const p = document.getElementById('tree-panel');
  if (p.style.display === 'flex') { p.style.display = 'none'; return; }
  renderTreeEditor();
  p.style.display = 'flex';
});
document.getElementById('tree-close').addEventListener('click', () => {
  document.getElementById('tree-panel').style.display = 'none';
});

/* ───── Top bar handlers ───── */
const fmtTime = h => {
  const hh = Math.floor(h);
  const mm = Math.round((h - hh) * 60).toString().padStart(2, '0');
  const ap = hh < 12 ? 'am' : 'pm';
  const d = hh > 12 ? hh - 12 : (hh === 0 ? 12 : hh);
  return `${d}:${mm} ${ap}`;
};
const dateToISO = d =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

document.getElementById('time-slider').addEventListener('input', (e) => {
  hour = Math.round(parseFloat(e.target.value) * 6) / 6;
  updateShadows();
});
document.getElementById('date-pick').addEventListener('change', (e) => {
  if (!e.target.value) return;
  const [y, m, d] = e.target.value.split('-').map(Number);
  currentDate = new Date(y, m-1, d);
  updateShadows();
  heatmapDate = null;
  if (heatmapOn) runHeatmap();
});
document.getElementById('run-shade').addEventListener('click', runHeatmap);
document.getElementById('toggle-heatmap').addEventListener('click', () => {
  heatmapOn = !heatmapOn;
  const btn = document.getElementById('toggle-heatmap');
  btn.classList.toggle('on', heatmapOn);
  if (heatmapOn) {
    if (heatmapDate !== currentDate.getTime()) { runHeatmap(); return; }
    if (!map.hasLayer(heatmapLyr)) heatmapLyr.addTo(map);
  } else {
    if (map.hasLayer(heatmapLyr)) map.removeLayer(heatmapLyr);
  }
});

/* ───── Boot ───── */
window.addEventListener('load', () => {
  document.getElementById('date-pick').value = dateToISO(currentDate);
  document.getElementById('time-display').textContent = fmtTime(hour);
  initMap();
  setTimeout(() => {
    map.invalidateSize();
    loadBuildings();
  }, 100);
});
</script>

</body>
