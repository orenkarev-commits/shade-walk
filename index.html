<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shade Walk · Rothschild</title>
<script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #map { position: fixed; inset: 0; }

  #top {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 200; display: flex; align-items: center; gap: 10px; white-space: nowrap;
    background: rgba(255,255,255,0.96); border: 1px solid rgba(0,0,0,0.12);
    border-radius: 99px; padding: 8px 10px 8px 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.14);
  }
  #app-name { font-size: 13px; font-weight: 700; color: #111; }
  #tsl { width: 150px; accent-color: #15803d; cursor: pointer; }
  #tval { font-size: 13px; font-weight: 600; color: #111; min-width: 64px; }
  .sb {
    font-size: 11px; padding: 5px 10px; border-radius: 99px;
    border: 1px solid rgba(0,0,0,0.15); background: transparent;
    cursor: pointer; color: #555; font-weight: 500; transition: all .15s;
  }
  .sb.on { background: #111; color: #fff; border-color: #111; }

  #sun-card {
    position: fixed; top: 70px; right: 14px; z-index: 200;
    background: rgba(255,255,255,0.96); border: 1px solid rgba(0,0,0,0.10);
    border-radius: 12px; padding: 10px 14px; font-size: 12px; color: #555; line-height: 1.7;
    box-shadow: 0 4px 16px rgba(0,0,0,0.10);
  }
  #sun-card strong { color: #111; font-size: 14px; font-weight: 700; display: block; }
  #help { position: fixed; bottom: 16px; left: 14px; z-index: 200; font-size: 11px; color: rgba(0,0,0,0.5);
          background: rgba(255,255,255,0.85); padding: 4px 10px; border-radius: 8px; }
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <span id="app-name">🌿 Shade Walk · Rothschild</span>
  <input type="range" id="tsl" min="6" max="19" step="0.5" value="9">
  <span id="tval">9:00 am</span>
  <button class="sb on" data-s="summer">Summer</button>
  <button class="sb"    data-s="spring">Spring</button>
  <button class="sb"    data-s="autumn">Autumn</button>
  <button class="sb"    data-s="winter">Winter</button>
</div>

<div id="sun-card">
  <strong id="sc-time">–</strong>
  <span id="sc-detail">–</span>
</div>

<div id="help">Drag the time slider — building &amp; tree shadows sweep across the route in real time.</div>

<script>
const MPD = 111320, LAT = 32.064, COS_LAT = Math.cos(LAT * Math.PI / 180);

/* Rothschild centreline → left walkway (8 m NW) */
const CL = [
  [32.06820,34.77793],[32.06817,34.77792],[32.06672,34.77746],[32.06667,34.77745],
  [32.06662,34.77743],[32.06593,34.77720],[32.06547,34.77671],[32.06543,34.77667],
  [32.06438,34.77557],[32.06350,34.77483],[32.06250,34.77400],[32.06150,34.77320],
  [32.06050,34.77240],[32.05950,34.77170],[32.05860,34.77110],[32.05770,34.77050],
  [32.05660,34.76990],[32.05560,34.76940],[32.05490,34.76910],
];
const ll = pts => pts.map(p => [p[1], p[0]]);
function offsetPoly(nodes, m) {
  return nodes.map((n, i) => {
    const p = nodes[Math.max(0,i-1)], q = nodes[Math.min(nodes.length-1,i+1)];
    const perp = Math.atan2((q[1]-p[1])*COS_LAT, q[0]-p[0]) + Math.PI/2;
    return [n[0]+Math.cos(perp)*m/MPD, n[1]+Math.sin(perp)*m/(MPD*COS_LAT)];
  });
}

/* Tree median sections (editable heights) */
const TREE_SECTIONS = [
  {name:'Habima – Allenby',from:0,to:2},{name:'Allenby – Gruzenberg',from:2,to:3},
  {name:'Gruzenberg – Balfour',from:3,to:5},{name:'Balfour – Shenkin',from:5,to:6},
  {name:'Shenkin – Brenner',from:6,to:8},{name:'Brenner – Herzl',from:8,to:9},
  {name:"Herzl – Ahad Ha'am",from:9,to:11},{name:"Ahad Ha'am – Shadal",from:11,to:13},
  {name:'Shadal – Florentin',from:13,to:15},{name:'Florentin – Neve Tzedek',from:15,to:18},
];
const treeH = [12,12,12,9,12,12,12,12,12,12];
function blockRing(pts, innerM, outerM) {
  const inner = ll(offsetPoly(pts, innerM)), outer = ll(offsetPoly(pts, outerM));
  return [...inner, ...outer.slice().reverse(), inner[0]];
}
function treesGJ() {
  return { type:'FeatureCollection', features: TREE_SECTIONS.map((s,i)=>({
    type:'Feature', id:2000+i, properties:{idx:i, height:treeH[i], name:s.name},
    geometry:{ type:'Polygon', coordinates:[blockRing(CL.slice(s.from,s.to+1), -4.5, 4.5)] }
  })) };
}
const walkGJ = () => ({ type:'Feature', geometry:{ type:'LineString', coordinates: ll(offsetPoly(CL,8)) } });

/* Sun — SunCalc */
const SEASON_DATE = { summer:[2025,6,1,3], spring:[2025,2,21,2], autumn:[2025,8,21,3], winter:[2025,11,21,2] };
const DIR16 = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
function getSun(hour, season) {
  const [y,m,d,tz] = SEASON_DATE[season];
  const hh = Math.floor(hour), mm = hour%1===0.5?30:0;
  const pos = SunCalc.getPosition(new Date(Date.UTC(y,m,d,hh-tz,mm)), 32.0639, 34.7717);
  const alt = pos.altitude*180/Math.PI, az = (pos.azimuth*180/Math.PI+180+360)%360;
  return { alt:Math.round(alt*10)/10, az:Math.round(az), up:alt>0.5, dir:DIR16[Math.round(az/22.5)%16] };
}
const fmtH = h => { const hh=Math.floor(h),mm=h%1===0.5?'30':'00',ap=hh<12?'am':'pm',d=hh>12?hh-12:(hh===0?12:hh); return `${d}:${mm} ${ap}`; };

/* Cast a flat ground-shadow polygon from a footprint ring */
function shadowRing(ring, dLon, dLat) {
  const shifted = ring.map(([lo,la]) => [lo+dLon, la+dLat]);
  return [...ring.slice(0,-1), ...shifted.slice(0,-1).reverse(), ring[0]];
}

const map = new maplibregl.Map({
  container:'map', style:'https://tiles.openfreemap.org/styles/bright',
  center:[34.7737,32.0625], zoom:16.2, pitch:55, bearing:18, antialias:true, maxPitch:72
});
map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

let hour = 9, season = 'summer', srcLayer = 'building';

map.on('load', () => {
  const style = map.getStyle();
  // Identify the vector source + remove the flat building layer (we extrude instead)
  const srcName = Object.keys(style.sources).find(k => style.sources[k].type === 'vector') || 'openmaptiles';
  ['building','building-top','building-3d'].forEach(id => { if (map.getLayer(id)) map.removeLayer(id); });
  const firstSymbol = style.layers.find(l => l.type === 'symbol')?.id;

  // Ground shadows (computed from real footprints) — under everything
  map.addSource('shadows', { type:'geojson', data:{type:'FeatureCollection',features:[]} });
  map.addLayer({ id:'shadows', type:'fill', source:'shadows',
    paint:{ 'fill-color':'#141008', 'fill-opacity':0.22 } }, firstSymbol);

  // 3D buildings — REAL OSM footprints from the vector tiles, extruded by height
  map.addLayer({ id:'buildings-3d', source:srcName, 'source-layer':'building', type:'fill-extrusion',
    paint:{
      'fill-extrusion-color':'#d9d2c5',
      'fill-extrusion-height':['coalesce',['get','render_height'],['*',['coalesce',['get','building:levels'],4],3.5],14],
      'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
      'fill-extrusion-opacity':0.97,
      'fill-extrusion-ambient-occlusion-intensity':0.4,
      'fill-extrusion-ambient-occlusion-radius':3
    } }, firstSymbol);

  // 3D trees
  map.addSource('trees', { type:'geojson', data:treesGJ() });
  map.addLayer({ id:'trees-3d', type:'fill-extrusion', source:'trees',
    paint:{ 'fill-extrusion-color':'#2e6b1f','fill-extrusion-height':['get','height'],
            'fill-extrusion-base':0,'fill-extrusion-opacity':0.88 } });

  // Route
  map.addSource('walk', { type:'geojson', data:walkGJ() });
  map.addLayer({ id:'walk-halo', type:'line', source:'walk', paint:{'line-color':'#fff','line-width':12,'line-opacity':0.75} });
  map.addLayer({ id:'walk-line', type:'line', source:'walk', paint:{'line-color':'#15803d','line-width':7,'line-cap':'round','line-join':'round'} });

  const wc = ll(offsetPoly(CL,8));
  addPill(wc[0],'▲ Habima','#15803d'); addPill(wc[wc.length-1],'Neve Tzedek','#666');

  // Tree editor
  map.on('click','trees-3d', e => {
    const i = e.features[0].properties.idx;
    const v = prompt(`Tree height for "${TREE_SECTIONS[i].name}" (metres):`, treeH[i]);
    const n = parseFloat(v); if (n>0 && n<40){ treeH[i]=n; map.getSource('trees').setData(treesGJ()); refreshShadows(); }
  });
  map.on('mouseenter','trees-3d',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','trees-3d',()=>map.getCanvas().style.cursor='');

  srcLayer = 'building';
  map.on('idle', refreshShadows);   // recompute once tiles settle / view changes
  updateSun();
});

/* Recompute ground shadows from the real building footprints currently loaded */
function refreshShadows() {
  if (!map.getSource('shadows')) return;
  const sun = getSun(hour, season);
  if (!sun.up) { map.getSource('shadows').setData({type:'FeatureCollection',features:[]}); return; }
  const az = sun.az*Math.PI/180, tanA = Math.tan(sun.alt*Math.PI/180);
  const feats = [];

  // Buildings (real OSM footprints from vector tiles)
  let bld = [];
  try { bld = map.querySourceFeatures(map.getLayer('buildings-3d').source, { sourceLayer:'building' }); } catch(_){}
  const seen = new Set();
  bld.forEach(f => {
    if (f.id != null) { if (seen.has(f.id)) return; seen.add(f.id); }
    const h = f.properties.render_height || (f.properties['building:levels']*3.5) || 14;
    const len = h/tanA, dLon = -Math.sin(az)*len/(MPD*COS_LAT), dLat = -Math.cos(az)*len/MPD;
    const polys = f.geometry.type==='MultiPolygon' ? f.geometry.coordinates : [f.geometry.coordinates];
    polys.forEach(rings => { if (rings[0]?.length>3) feats.push({ type:'Feature',
      geometry:{ type:'Polygon', coordinates:[shadowRing(rings[0], dLon, dLat)] } }); });
  });

  // Trees
  treesGJ().features.forEach(f => {
    const len = f.properties.height/tanA, dLon=-Math.sin(az)*len/(MPD*COS_LAT), dLat=-Math.cos(az)*len/MPD;
    feats.push({ type:'Feature', geometry:{ type:'Polygon', coordinates:[shadowRing(f.geometry.coordinates[0], dLon, dLat)] } });
  });

  map.getSource('shadows').setData({ type:'FeatureCollection', features:feats });
}

function updateSun() {
  const sun = getSun(hour, season);
  if (sun.up) {
    try { map.setLights([
      {id:'ambient',type:'ambient',properties:{color:'#fff',intensity:0.3}},
      {id:'sun',type:'directional',properties:{color:'#fff7da',intensity:0.9,direction:[sun.az,90-sun.alt]}}
    ]); } catch(_){}
  } else {
    try { map.setLights([{id:'ambient',type:'ambient',properties:{color:'#b6c6dd',intensity:0.55}}]); } catch(_){}
  }
  document.getElementById('sc-time').textContent = '☀ ' + fmtH(hour);
  document.getElementById('sc-detail').innerHTML = sun.up
    ? `${sun.alt}° altitude · from ${sun.dir} (${sun.az}°)<br>14m building casts ${Math.round(14/Math.tan(sun.alt*Math.PI/180))}m shadow`
    : 'Sun below horizon';
  refreshShadows();
}

function addPill(lngLat, txt, bg) {
  const el = Object.assign(document.createElement('div'), { textContent:txt,
    style:`background:${bg};color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.3);` });
  new maplibregl.Marker({ element:el, anchor:'left' }).setLngLat(lngLat).addTo(map);
}

document.getElementById('tsl').addEventListener('input', function(){
  hour = parseFloat(this.value); document.getElementById('tval').textContent = fmtH(hour);
  if (map.loaded()) updateSun();
});
document.querySelectorAll('.sb').forEach(b => b.addEventListener('click', ()=>{
  document.querySelectorAll('.sb').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); season = b.dataset.s; if (map.loaded()) updateSun();
}));
</script>
</body>
</html>
